name: VexBoard Candidate Subject Consistency Proof

on:
  push:
    branches:
      - VXG-112026-vexboard-candidate-subjects-and-selection-behavior-a001
    paths:
      - 'projects/vexboard/lens/catalog.json'
      - 'projects/vexboard/lens/vexstream-music.main.screen-lens.json'
      - 'src/shared/vexboard-lens-catalog.mjs'
      - 'src/shared/vexboard-screen-lens-realization.mjs'
      - 'src/shared/vexboard-screen-lens-source-expressions.mjs'
      - 'scripts/build-screen-lens.mjs'
      - 'vexboard/lens.html'
      - 'test/vexboard-lens-catalog.test.mjs'
      - 'test/vexboard-screen-lens-realization.test.mjs'
      - 'test/vexboard-screen-lens-source-expressions.test.mjs'
      - 'test/vexboard-lens-ui.test.mjs'
      - '.github/workflows/vexboard-candidate-subject-consistency-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Focused contract tests
        run: |
          node --test \
            test/vexboard-lens-catalog.test.mjs \
            test/vexboard-screen-lens-realization.test.mjs \
            test/vexboard-screen-lens-source-expressions.test.mjs \
            test/vexboard-lens-ui.test.mjs
      - name: Verify every cataloged Lens build
        run: npm run lens:verify
      - name: Verify VexStream Main regenerates from Product source
        run: node scripts/build-screen-lens.mjs --subject vexstream-music --build main --fetch --check
      - name: Full VexBoard regression floor
        run: node --test test/vexboard*.test.mjs
      - name: Serve repository
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Candidate subject uses the shared build frame
        shell: bash
        run: |
          timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 \
            --dump-dom 'http://127.0.0.1:8000/vexboard/lens.html?subject=vexstream-music' \
            >/tmp/subject.html 2>/tmp/subject.log || true
          grep -q 'VexStream Music' /tmp/subject.html
          grep -q '>Stable<' /tmp/subject.html
          grep -q 'not accepted' /tmp/subject.html
          grep -q '>Main<' /tmp/subject.html
          grep -q 'a70c529' /tmp/subject.html
          grep -q 'Commit…' /tmp/subject.html
          ! grep -q 'Screen Lens could not start' /tmp/subject.html
      - name: Discover control resolves through generic selection Behavior
        shell: bash
        run: |
          timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 \
            --dump-dom 'http://127.0.0.1:8000/vexboard/lens.html?subject=vexstream-music&element=element.vexstream.shell.view.discover' \
            >/tmp/discover.html 2>/tmp/discover.log || true
          grep -q 'Shell view: Discover' /tmp/discover.html
          grep -q 'ShellNavigation.project' /tmp/discover.html
          grep -q 'selected(' /tmp/discover.html
          ! grep -q 'Shell view: Discover has no projected pathway yet' /tmp/discover.html
