name: VexStream Projectability Source Proof

on:
  pull_request:
    branches:
      - currentize/vexboard-realization-topology-on-sync-20261120
    paths:
      - 'projects/vexstream-music-projectability/**'
      - 'workgraphs/segments/vexstream-music-projectability.json'
      - '.github/workflows/vexstream-projectability-source-proof.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate VexStream projectability source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createProject } from './src/core/workgraph.mjs';
          import { createWorkgraphSegment } from './src/core/workgraph-composition.mjs';

          const read = path => JSON.parse(fs.readFileSync(path,'utf8'));
          const registry = read('blueprint/work-registry.json');
          const project = createProject(read('projects/vexstream-music-projectability/project.json'));
          const segment = createWorkgraphSegment(read('workgraphs/segments/vexstream-music-projectability.json'),registry);

          assert.deepEqual(project.rootWorkRefs,['work.vexstream-music.projectability.outcome']);
          assert.equal(segment.items.length,6);
          assert.equal(segment.transitions.length,2);
          assert.equal(segment.items.find(x=>x.workRef==='work.vexstream-music.projectability.outcome')?.state,'RUNNING');
          assert.equal(segment.items.find(x=>x.workRef==='work.vexstream-music.projectability.current-source-map')?.state,'RUNNING');
          console.log(JSON.stringify({state:'PASS',projectRef:project.projectRef,items:segment.items.length,transitions:segment.transitions.length},null,2));
          NODE
