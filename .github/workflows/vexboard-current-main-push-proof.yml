name: VexBoard Current-Main Push Proof

on:
  push:
    branches:
      - currentize/vexboard-realization-topology-current-main-20261120

permissions:
  contents: read

jobs:
  current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: VexBoard focused projection and realization proof
        run: |
          node --test \
            test/vexboard-lens-ui.test.mjs \
            test/vexboard-screen-lens.test.mjs \
            test/vexboard-screen-lens-realization.test.mjs \
            test/vexboard-screen-lens-source-expressions.test.mjs \
            test/vexboard-screen-lens-frames.test.mjs \
            test/vexboard-screen-lens-conformance.test.mjs \
            test/vexboard-screen-lens-android-adapter.test.mjs \
            test/vexboard-screen-lens-generated.test.mjs \
            test/vexboard-android-realization.test.mjs
      - name: Projection Consolidation source closure
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createProject } from './src/core/workgraph.mjs';
          import { createWorkgraphSegment } from './src/core/workgraph-composition.mjs';

          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const registry = read('blueprint/work-registry.json');
          const project = createProject(read('projects/vexboard-projection-consolidation/project.json'));
          const segment = createWorkgraphSegment(read('workgraphs/segments/vexboard-projection-consolidation.json'), registry);

          assert.deepEqual(project.rootWorkRefs, ['work.vexboard.projection-consolidation.outcome']);
          assert.equal(segment.items.length, 6);
          assert.equal(segment.items.every((item) => item.state === 'COMPLETED'), true);
          assert.equal(segment.transitions.length, 22);
          assert.equal(segment.sourceRefs.includes('github.pull.vexwork.377'), true);
          assert.equal(project.sourceRefs.includes('human.victor.projection-foundation-acceptance-2026-11-20'), true);
          console.log(JSON.stringify({state:'PASS', projectRef:project.projectRef, items:segment.items.length, transitions:segment.transitions.length}, null, 2));
          NODE
      - name: Generated currentness
        run: |
          node scripts/build-project-registry.mjs --check
          node scripts/build-public-workgraph.mjs --check
          node scripts/build-public-workspace.mjs --check
