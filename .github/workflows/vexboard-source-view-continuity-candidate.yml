name: SOURCE_VIEW Continuity Candidate Proof

on:
  pull_request:
    branches:
      - currentize/vexboard-realization-topology-on-sync-20261120
    paths:
      - 'vexboard/lens.html'
      - 'test/vexboard-lens-ui.test.mjs'
      - '.github/workflows/vexboard-source-view-continuity-candidate.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: SOURCE_VIEW continuity + shared Lens regression floor
        run: |
          node --test \
            test/vexboard-lens-ui.test.mjs \
            test/vexboard-screen-lens.test.mjs \
            test/vexboard-screen-lens-realization.test.mjs \
            test/vexboard-screen-lens-source-expressions.test.mjs
