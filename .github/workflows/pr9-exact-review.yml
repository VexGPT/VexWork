name: PR 9 exact VexWork review proof

on:
  push:
    branches:
      - VXG-102126-pr9-review-proof

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: a78e584ccb289e993ca44f06d5e7c8e948b0cd7d
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact candidate
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "a78e584ccb289e993ca44f06d5e7c8e948b0cd7d"
          test "$(git rev-parse HEAD^{tree})" = "502566796e7a74378840e91f123ce5cab5e58cbf"

      - name: Run exact VexWork review
        run: npm run review
