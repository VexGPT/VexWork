name: PR 9 exact VexWork review proof

on:
  push:
    branches:
      - VXG-102126-pr9-review-proof

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: 1e965974704b7ac54d1ff7aa4ba0076469127019
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact candidate
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "1e965974704b7ac54d1ff7aa4ba0076469127019"
          test "$(git rev-parse HEAD^{tree})" = "e74d2c0f0e0a46988b68b2d642968036589b1f78"

      - name: Run exact VexWork review
        run: npm run review
