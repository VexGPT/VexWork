name: PR 9 exact VexWork review proof

on:
  push:
    branches:
      - VXG-102126-pr9-review-proof

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ee4de3f73c95a4f346b3e0835369ce7adb9407e9
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact candidate
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "ee4de3f73c95a4f346b3e0835369ce7adb9407e9"
          test "$(git rev-parse HEAD^{tree})" = "e5e8148e56c4178ae66bda46e91c95e995512c80"

      - name: Run exact VexWork review
        run: npm run review
