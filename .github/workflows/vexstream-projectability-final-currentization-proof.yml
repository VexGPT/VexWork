name: VexStream Projectability Final Currentization Proof

on:
  push:
    branches:
      - VXG-112026-vexstream-music-projectability-a001
    paths:
      - '.github/workflows/vexstream-projectability-final-currentization-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/shared/vexboard-screen-lens-identity.mjs
          node --check src/shared/vexboard-screen-lens.mjs
          node --check src/shared/vexboard-screen-lens-realization.mjs
      - name: Shared Screen Lens regression floor
        run: |
          node --test \
            test/vexboard-screen-lens-conformance.test.mjs \
            test/vexboard-lens-ui.test.mjs \
            test/vexboard-screen-lens.test.mjs \
            test/vexboard-screen-lens-realization.test.mjs \
            test/vexboard-screen-lens-source-expressions.test.mjs \
            test/vexboard-screen-lens-frames.test.mjs
      - name: Current merged Product binding
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const project=JSON.parse(fs.readFileSync('projects/vexstream-music-projectability/project.json','utf8'));
          const lens=JSON.parse(fs.readFileSync('projects/vexboard/lens/vexstream-music.candidate.screen-lens.json','utf8'));
          assert.ok(project.sourceRefs.includes('github.pull.vexstream-music.31'));
          assert.equal(lens.sourceSnapshot.commit,'26a565d94a76860c4def02c6227286cd50caa531');
          assert.equal(lens.screens[0].realization.templates.length,2);
          assert.equal(lens.screens[0].realization.templates[0].instanceIdentity.continuity,'STABLE_INSTANCE');
          assert.equal(lens.screens[0].realization.templates[1].instanceIdentity.continuity,'CURRENT_OCCURRENCE');
          console.log(JSON.stringify({state:'PASS',source:lens.sourceSnapshot.commit,templates:2},null,2));
          NODE
