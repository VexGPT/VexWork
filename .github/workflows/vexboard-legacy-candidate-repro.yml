name: VexBoard Visible Diagnostics Proof

on:
  push:
    branches:
      - VXG-112026-vexboard-null-visibility-resilience-a001
    paths:
      - 'vexboard/lens.html'
      - 'test/vexboard-lens-ui.test.mjs'
      - '.github/workflows/vexboard-legacy-candidate-repro.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static Lens UI regression
        run: node --test test/vexboard-lens-ui.test.mjs
      - name: Serve repository
        shell: bash
        run: |
          cat > vexboard/diagnostic-harness.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <iframe id="lens" src="lens.html?lens=vexstream-music.candidate.screen-lens.json"></iframe>
          <pre id="result">pending</pre>
          <script>
          const frame=document.getElementById('lens');
          frame.addEventListener('load',()=>{
            setTimeout(()=>{
              const doc=frame.contentDocument;
              const before=Boolean(doc.querySelector('.lens'));
              frame.contentWindow.dispatchEvent(new ErrorEvent('error',{
                message:"Cannot read properties of null (reading 'steps')",
                error:new TypeError("Cannot read properties of null (reading 'steps')")
              }));
              setTimeout(()=>{
                const preserved=Boolean(doc.querySelector('.lens'));
                const dock=Boolean(doc.querySelector('#vexboard-diagnostics'));
                const diagnosticText=doc.querySelector('#vexboard-diagnostics')?.textContent??'';
                document.getElementById('result').textContent=[
                  'before='+before,
                  'preserved='+preserved,
                  'dock='+dock,
                  'nullVisible='+diagnosticText.includes('NULL_STATE'),
                  'messageVisible='+diagnosticText.includes("Cannot read properties of null")
                ].join('\n');
              },250);
            },900);
          });
          </script>
          HTML
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Bare legacy shorthand opens the VexStream Lens
        shell: bash
        run: |
          timeout 25s google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6000             --dump-dom 'http://127.0.0.1:8000/vexboard/lens.html?lens=vexstream-music.candidate.screen-lens.json'             >/tmp/bare.html 2>/tmp/bare.log || true
          grep -q '<div id="app"><div class="lens' /tmp/bare.html
          grep -q 'VexStream Music' /tmp/bare.html
          ! grep -q '<div id="app"><section class="boot"><h1>Screen Lens could not start' /tmp/bare.html
      - name: Explicit relative candidate path still opens
        shell: bash
        run: |
          timeout 25s google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6000             --dump-dom 'http://127.0.0.1:8000/vexboard/lens.html?lens=../projects/vexboard/lens/vexstream-music.candidate.screen-lens.json'             >/tmp/explicit.html 2>/tmp/explicit.log || true
          grep -q '<div id="app"><div class="lens' /tmp/explicit.html
          grep -q 'VexStream Music' /tmp/explicit.html
      - name: Runtime null-style fault preserves the Lens and becomes visible
        shell: bash
        run: |
          timeout 25s google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000             --dump-dom 'http://127.0.0.1:8000/vexboard/diagnostic-harness.html'             >/tmp/harness.html 2>/tmp/harness.log || true
          grep -A6 -B2 'before=' /tmp/harness.html || true
          grep -q 'before=true' /tmp/harness.html
          grep -q 'preserved=true' /tmp/harness.html
          grep -q 'dock=true' /tmp/harness.html
          grep -q 'nullVisible=true' /tmp/harness.html
          grep -q 'messageVisible=true' /tmp/harness.html
