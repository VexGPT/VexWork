name: TEMP Project Closeout Candidate Review

on:
  push:
    branches:
      - VXG-112126-chatgpt-project-closeout-succession-a001

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build canonical VexWork projections
        run: |
          npm run workspace:build
          npm run dashboard:build

      - name: Run deterministic VexWork review
        run: npm run review

      - name: Pack reviewed generated projection
        run: |
          mkdir -p candidate-review
          cp blueprint/project-registry.json candidate-review/project-registry.json
          cp workgraphs/public.json candidate-review/workgraph-public.json
          cp public/workspace.json candidate-review/workspace.json
          cp public/work-dashboard.json candidate-review/work-dashboard.json
          printf '%s\n' "$GITHUB_SHA" > candidate-review/source-head.txt

      - name: Upload reviewed generated projection
        uses: actions/upload-artifact@v4
        with:
          name: vexwork-project-closeout-generated
          path: candidate-review/

      - name: Commit exact generated consequences and retire this temporary proof carrier
        run: |
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git add \
            blueprint/project-registry.json \
            workgraphs/public.json \
            public/workspace.json \
            public/work-dashboard.json
          git rm .github/workflows/temp-project-closeout-review.yml
          git commit -m "[Project Closeout][GENERATED] Bind reviewed portfolio projections"
          git push origin HEAD:VXG-112126-chatgpt-project-closeout-succession-a001
