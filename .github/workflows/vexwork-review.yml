name: VexWork deterministic review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: vexwork-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Runtime identity
        run: |
          node --version
          npm --version

      - name: VexWork review
        run: npm run review
