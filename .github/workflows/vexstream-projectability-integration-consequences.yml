name: VexStream Projectability Integration Consequences

on:
  push:
    branches:
      - currentize/vexstream-music-projectability-current-main-20261120
    paths:
      - '.github/workflows/vexstream-projectability-integration-consequences.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: currentize/vexstream-music-projectability-current-main-20261120
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate integration consequences
        run: |
          npm run workspace:build
          npm run dashboard:build
      - name: Enforce generated integration membrane
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -v -E '^(blueprint/project-registry\.json|workgraphs/public\.json|public/workspace\.json|public/work-dashboard\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected integration delta:"
            echo "$unexpected"
            exit 1
          fi
      - name: Verify deterministic currentness
        run: |
          npm run project-registry:check
          npm run workgraph:check
          npm run workspace:check
          npm run dashboard:check
          npm run check
      - name: Commit generated integration truth
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated integration delta."
            exit 0
          fi
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git add blueprint/project-registry.json workgraphs/public.json public/workspace.json public/work-dashboard.json
          git commit -m "[VexStream Projectability][CURRENTNESS] Regenerate integration consequences" -m "[VXG RealForever]"
          git push origin HEAD:currentize/vexstream-music-projectability-current-main-20261120
