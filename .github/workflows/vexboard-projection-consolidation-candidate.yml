name: Projection Consolidation Candidate Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'projects/vexboard-projection-consolidation/**'
      - 'projects/vexboard/PROJECTING-AN-EXISTING-PROJECT.md'
      - 'projects/vexboard/README.md'
      - 'projects/vexboard/PROJECTS-AND-BUILDS.md'
      - 'test/vexboard-screen-lens-conformance.test.mjs'
      - 'test/fixtures/screen-lens/neutral-framed-element-tree.screen-lens.json'
      - '.github/workflows/vexboard-projection-consolidation-candidate.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cross-project conformance and regression floor
        run: |
          node --test \
            test/vexboard-screen-lens-conformance.test.mjs \
            test/vexboard-screen-lens.test.mjs \
            test/vexboard-screen-lens-realization.test.mjs \
            test/vexboard-screen-lens-source-expressions.test.mjs \
            test/vexboard-screen-lens-frames.test.mjs \
            test/vexboard-lens-ui.test.mjs
      - name: Offline Lens build verification with bounded pre-existing Product pin debt
        run: |
          set +e
          node scripts/build-screen-lens.mjs --verify > /tmp/lens-verify.json
          verify_status=$?
          set -e
          cat /tmp/lens-verify.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync('/tmp/lens-verify.json', 'utf8'));
          const allowed = new Set([
            'vexlife-prod stable: sourceBlobSha1 differs',
            'vexlife-prod main: sourceBlobSha1 differs',
          ]);
          const unexpected = (report.failures ?? []).filter((failure) => !allowed.has(failure));
          if (unexpected.length) {
            throw new Error('unexpected Lens verification failure(s): ' + unexpected.join('; '));
          }

          const android = (report.builds ?? []).filter((build) => build.subject === 'vexlife-android');
          if (!android.length || android.some((build) => build.state !== 'PASS')) {
            throw new Error('Android Stable/Main must remain PASS in Lens verification');
          }

          const product = (report.builds ?? []).filter((build) => build.subject === 'vexlife-prod');
          for (const build of product) {
            const stale = build.stale ?? [];
            if (build.problems?.length) throw new Error('Product Lens has projection problems: ' + build.problems.join('; '));
            if (build.state !== 'PASS' && !(build.state === 'STALE' && stale.length === 1 && stale[0] === 'sourceBlobSha1')) {
              throw new Error('Product Lens has unbounded verification state: ' + JSON.stringify(build));
            }
          }

          console.log(JSON.stringify({
            state: unexpected.length ? 'FAIL' : 'PASS_WITH_BOUNDED_CURRENTNESS_DEBT',
            allowedCurrentnessDebt: (report.failures ?? []).filter((failure) => allowed.has(failure)),
          }, null, 2));
          NODE

          if [ "$verify_status" -eq 0 ]; then
            echo "Lens verification is fully current."
          else
            echo "Lens verification differs only by the bounded Product sourceBlobSha1 debt routed to #361."
          fi
