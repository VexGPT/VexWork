<title>VexWork Terrain Map — experimental v2</title>
<meta name="description" content="Experimental read-only relational Terrain projection over VexWork truth.">
<style>
:root{--ink:#1c1917;--muted:#78716c;--faint:#a8a29e;--line:#e7e5e4;--blue:#2563eb;--paper:#fff;--wash:#fafaf9;--ember:#b45830}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--wash);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.shell{width:min(1460px,calc(100% - 28px));margin:auto}.top{border-bottom:1px solid var(--line)}.family{display:flex;gap:8px;align-items:center;padding:16px 0 10px;font:15px Georgia,serif}.family a{color:var(--muted);text-decoration:none}.family .current{font-weight:700;color:var(--ink)}.sep{color:#d6d3d1}.bar{display:flex;align-items:center;gap:14px;padding:13px 0}.brand{display:flex;align-items:baseline;gap:12px;white-space:nowrap}.brand a{color:var(--ink);text-decoration:none}.brand strong{font:700 30px Georgia,serif}.brand span{font:700 10px ui-monospace,monospace;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}.brand em{font:8px ui-monospace,monospace;color:var(--ember);text-transform:uppercase;letter-spacing:.12em}.search{margin-left:auto;width:min(420px,44vw);border:1px solid #d6d3d1;border-radius:9px;background:#f2f2f0;padding:10px 12px}.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 42%,#eff6ff,transparent 42%),var(--wash)}.world{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .16s ease,opacity .16s ease}.node{position:absolute;left:50%;top:50%;width:200px;min-height:92px;transform:translate(-50%,-50%);border:1px solid #d6d3d1;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 10px 28px rgba(28,25,23,.06);padding:13px;text-align:left;color:var(--ink)}.node:hover,.node:focus-visible{outline:none;border-color:#93c5fd}.node.focus{width:min(430px,58vw);min-height:180px;padding:21px;border-color:#93c5fd;z-index:4}.kind{font:8px ui-monospace,monospace;color:var(--blue);text-transform:uppercase;letter-spacing:.11em}.node h2,.node h3{margin:7px 0 5px;line-height:1.08}.node h2{font:700 clamp(26px,4vw,40px) Georgia,serif}.node h3{font-size:15px}.node p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.meta{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap}.chip{padding:3px 6px;border-radius:999px;background:#f1f0ee;color:var(--muted);font:8px ui-monospace,monospace}.edge{position:absolute;left:50%;top:50%;height:1px;background:#d6d3d1;transform-origin:0 50%;z-index:1}.edge-label{position:absolute;z-index:2;transform:translate(-50%,-50%);padding:3px 6px;border-radius:999px;background:rgba(250,250,249,.94);font:8px ui-monospace,monospace;color:var(--faint)}.rail{position:absolute;left:14px;top:15px;bottom:15px;z-index:10;width:78px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);padding:10px 7px;overflow:auto}.rail strong{display:block;margin-bottom:9px;font:8px ui-monospace,monospace;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}.crumb{display:block;width:100%;border:0;background:transparent;padding:5px 3px;text-align:left;color:var(--muted);font:8px/1.25 ui-monospace,monospace}.crumb.current{color:var(--blue);font-weight:700}.orientation{position:absolute;left:106px;right:14px;top:15px;z-index:8;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.84);padding:9px 11px;backdrop-filter:blur(8px);pointer-events:none}.orientation strong{font:700 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}.orientation span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px}.orientation small{margin-left:auto;color:var(--faint);font:9px ui-monospace,monospace}.inspect{position:absolute;right:14px;top:72px;bottom:14px;z-index:12;width:min(360px,38vw);border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.96);padding:12px;overflow:auto;transform:translateX(calc(100% + 28px));transition:transform .18s ease}.inspect.open{transform:none}.inspect h4{margin:14px 0 6px;font:700 8px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}.inspect code{display:block;white-space:pre-wrap;word-break:break-word;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fafaf9;font:9px/1.45 ui-monospace,monospace}.tools{position:absolute;right:14px;top:15px;z-index:11;display:flex;gap:7px;transform:translateY(52px)}.tool{border:1px solid #d6d3d1;border-radius:8px;background:#fff;padding:7px 9px;color:var(--ink);font-size:10px}.history{position:absolute;left:106px;right:14px;bottom:14px;z-index:9;display:none;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.94);padding:10px}.history.open{display:block}.track{display:flex;gap:7px;overflow:auto}.event{flex:0 0 auto;max-width:210px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;text-align:left}.event strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event small{display:block;margin-top:3px;color:var(--faint);font:8px ui-monospace,monospace}.results{position:absolute;right:14px;top:64px;z-index:30;width:min(430px,90vw);max-height:50vh;overflow:auto;border:1px solid #d6d3d1;border-radius:9px;background:#fff;padding:5px;box-shadow:0 12px 32px rgba(28,25,23,.12)}.results[hidden]{display:none}.result{display:block;width:100%;border:0;border-radius:6px;background:transparent;padding:9px;text-align:left}.result:hover{background:#eff6ff}.result strong,.result small{display:block}.result small{margin-top:3px;color:var(--muted);font:8px ui-monospace,monospace}.hint{position:absolute;left:50%;bottom:15px;z-index:20;transform:translateX(-50%);border:1px solid #d6d3d1;border-radius:999px;background:#fff;padding:7px 10px;color:var(--muted);font:9px ui-monospace,monospace}.hint[hidden]{display:none}@media(max-width:760px){.bar{flex-wrap:wrap}.brand{width:100%}.search{width:100%;margin:0}.rail{width:62px}.orientation{left:80px}.node.focus{width:min(330px,72vw)}.inspect{width:calc(100% - 90px)}.history{left:80px}.tools{top:62px}.edge,.edge-label{display:none}}
</style>
</head>
<body><div class="app"><div class="top"><div class="shell"><nav class="family" aria-label="Vextreme, VexLife, and VexWork homes"><a href="https://vgong24.github.io/Vextreme/pages/terrain-map.html?view=content&amp;profile=evolution-v1">Vextreme</a><span class="sep">/</span><a href="https://vgong24.github.io/VexLife/">VexLife</a><span class="sep">/</span><a class="current" href="./">VexWork</a></nav><div class="bar"><div class="brand"><a href="./"><strong>VexWork</strong></a><span>Terrain Map</span><em>experimental v2</em></div><input id="search" class="search" type="search" placeholder="Travel to a Project or work ref…" aria-label="Find Terrain destination"></div></div></div><main class="stage" id="stage"><div id="world" class="world"></div><aside id="rail" class="rail"><strong>Depth</strong><div id="depth"></div></aside><div class="orientation"><strong id="orientationTitle">VexWork</strong><span id="orientationSummary">Loading read-only workspace…</span><small id="orientationMeta"></small></div><div class="tools"><button id="inspectToggle" class="tool" type="button">Inspect</button><button id="historyToggle" class="tool" type="button">Journey</button></div><aside id="inspect" class="inspect" aria-label="Current Terrain frame"></aside><section id="history" class="history" aria-label="Terrain journey"><div id="historyTrack" class="track"></div></section><div id="searchResults" class="results" hidden></div><div id="hint" class="hint" role="status" hidden></div></main></div>
<script type="module">
import {RELATIONSHIP,createTerrainSession} from './terrain-reader.js';
const WORKSPACE_URL='./public/workspace.json';const relationshipLabel={PROJECT:'project',PROJECT_ROOT:'root outcome',CONTAINS:'contains',PARENT:'parent',DEPENDS_ON:'depends on',DEPENDED_ON_BY:'depended on by',RETURN:'return',REVISIT:'revisit',SEARCH_PORTAL:'search'};let workspace=null,session=null,pixelScale=1,hovered=null,seq=0,wheel={candidate:null,inward:0,lastOutAt:0};const world=document.getElementById('world'),stage=document.getElementById('stage'),depth=document.getElementById('depth'),inspect=document.getElementById('inspect'),historyPanel=document.getElementById('history'),historyTrack=document.getElementById('historyTrack'),search=document.getElementById('search'),searchResults=document.getElementById('searchResults'),hint=document.getElementById('hint'),title=document.getElementById('orientationTitle'),summary=document.getElementById('orientationSummary'),meta=document.getElementById('orientationMeta');
const el=(tag,cls,text='')=>{const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=String(text);return n};const tone=s=>['COMPLETED','CONVERGED','CLOSED'].includes(s)?'done':['BLOCKED','FAILED_RECOVERABLE'].includes(s)?'blocked':['WAITING_DEPENDENCIES','WAITING_RESOURCE','WAITING_HUMAN','HELD_UNKNOWN','PAUSED_AT_CHECKPOINT'].includes(s)?'waiting':'open';function showHint(text){hint.textContent=text;hint.hidden=false;clearTimeout(showHint.t);showHint.t=setTimeout(()=>hint.hidden=true,2200)}
function keyFromUrl(){const p=new URLSearchParams(location.search),project=p.get('project'),work=p.get('work');return work&&project?`work:${project}:${work}`:project?`project:${project}`:'workspace:vexwork'}function syncUrl(frame,{replace=false}={}){const u=new URL(location.href);u.search='';if(frame.projectRefOrNull)u.searchParams.set('project',frame.projectRefOrNull);if(frame.workRefOrNull)u.searchParams.set('work',frame.workRefOrNull);window.history[replace?'replaceState':'pushState']({vexworkTerrain:true},'',u)}
function position(entry,index,total){if(innerWidth<=760)return{x:0,y:155+index*115};const rel=entry.relationshipKinds[0],angle=(Math.PI*2*index/Math.max(1,total))-Math.PI/2,r=Math.min(310,190+total*10);if(rel==='PARENT')return{x:0,y:-250};if(rel==='DEPENDS_ON')return{x:300,y:30};if(rel==='DEPENDED_ON_BY')return{x:-300,y:30};return{x:Math.cos(angle)*r,y:Math.sin(angle)*r}}
function nodeButton(node,{focus=false,entry=null,index=0,total=1}={}){const b=el('button','node'+(focus?' focus':''));b.type='button';const p=focus?{x:0,y:0}:position(entry,index,total);b.style.marginLeft=p.x+'px';b.style.marginTop=p.y+'px';b.append(el('div','kind',node.kind+(entry?' · '+entry.relationshipKinds.map(r=>relationshipLabel[r]||r).join(' · '):'')),el(focus?'h2':'h3','',node.label),el('p','',node.purpose||node.semanticRef));const m=el('div','meta');if(node.state)m.append(el('span','chip '+tone(node.state),node.state));if(node.workClass)m.append(el('span','chip',node.workClass));b.append(m);if(!focus){b.onmouseenter=()=>hovered=entry;b.onmouseleave=()=>{if(hovered===entry)hovered=null};b.onclick=()=>travel(node.nodeKey,entry.relationshipKinds[0],'action.terrain.select')}else b.onclick=()=>{pixelScale=1;applyScale()};return b}
function drawEdge(entry,index,total){if(innerWidth<=760)return;const p=position(entry,index,total),len=Math.hypot(p.x,p.y),deg=Math.atan2(p.y,p.x)*180/Math.PI,line=el('div','edge');line.style.width=len+'px';line.style.transform=`rotate(${deg}deg)`;const lab=el('div','edge-label',entry.relationshipKinds.map(r=>relationshipLabel[r]||r).join(' · '));lab.style.left=`calc(50% + ${p.x*.52}px)`;lab.style.top=`calc(50% + ${p.y*.52}px)`;world.append(line,lab)}
function renderDepth(frame){depth.replaceChildren();frame.structuralPath.forEach(n=>{const b=el('button','crumb'+(n.nodeKey===frame.focus.nodeKey?' current':''),n.label);b.type='button';b.title=n.semanticRef;b.onclick=()=>n.nodeKey===frame.focus.nodeKey?(pixelScale=1,applyScale()):travel(n.nodeKey,RELATIONSHIP.PARENT,'action.terrain.depth');depth.append(b)})}
function renderInspect(frame){inspect.replaceChildren();inspect.append(el('h4','', 'Identity'),el('code','',`${frame.focus.kind}\n${frame.focus.semanticRef}`),el('h4','','Structural path'),el('code','',frame.structuralPath.map(n=>n.semanticRef).join('\n→ ')),el('h4','','Traversal path'),el('code','',frame.traversalPath.map(s=>(s.relationshipKind?`${s.relationshipKind} → `:'')+s.semanticRef).join('\n')),el('h4','','Entered via'),el('code','',frame.enteredViaOrNull?JSON.stringify(frame.enteredViaOrNull,null,2):'Direct / structural entry'),el('h4','','Neighborhood'),el('code','',JSON.stringify({shown:frame.neighborhood.neighbors.map(n=>({ref:n.node.semanticRef,relationships:n.relationshipKinds})),hidden:frame.neighborhood.hiddenNeighborCount},null,2)))}
function renderHistory(){const events=session.journey();historyTrack.replaceChildren();events.forEach((event,index)=>{const b=el('button','event');b.type='button';b.append(el('strong','',event.after.focus.label),el('small','',(relationshipLabel[event.relationshipKind]||event.relationshipKind)+' · '+event.actionRef));b.onclick=()=>{const view=session.inspectHistory(index);inspect.classList.add('open');renderInspect(view.currentFrame);inspect.append(el('h4','','History inspection'),el('code','',`Current: ${view.currentFrame.focus.semanticRef}\nInspecting: ${view.inspectedFrame.focus.semanticRef}\n\nHistory inspection does not move current context.`));const revisit=el('button','tool','Revisit');revisit.disabled=!view.browsingHistory;revisit.onclick=async()=>{const r=await session.revisit(index,{commandRef:`command.terrain.revisit.${++seq}`});if(r.state==='COMMITTED'){syncUrl(r.frame);render()}else showHint('Already at this semantic context')};inspect.append(revisit)};historyTrack.append(b)})}
function render(){const frame=session.currentFrame();title.textContent=frame.focus.label;summary.textContent=frame.focus.purpose||frame.focus.semanticRef;meta.textContent=`${frame.neighborhood.neighbors.length}${frame.neighborhood.hiddenNeighborCount?` + ${frame.neighborhood.hiddenNeighborCount} hidden`:''} nearby`;renderDepth(frame);world.replaceChildren();frame.neighborhood.neighbors.forEach((e,i)=>drawEdge(e,i,frame.neighborhood.neighbors.length));frame.neighborhood.neighbors.forEach((e,i)=>world.append(nodeButton(e.node,{entry:e,index:i,total:frame.neighborhood.neighbors.length})));world.append(nodeButton(frame.focus,{focus:true}));renderInspect(frame);renderHistory();applyScale()}
function applyScale(){world.style.transform=`scale(${pixelScale})`}async function travel(key,rel,action){const r=await session.navigate(key,rel,{commandRef:`command.terrain.ui.${++seq}`,actionRef:action});if(r.state==='COMMITTED'){pixelScale=1;wheel={candidate:null,inward:0,lastOutAt:0};syncUrl(r.frame);render()}else if(r.state==='ALREADY_PRESENT'){pixelScale=1;applyScale();showHint('Already at this semantic context')}else showHint(r.state)}
function scrollPathCanMove(target,direction){let n=target?.nodeType===1?target:target?.parentElement;while(n&&n!==document.body){const s=getComputedStyle(n);if(/(auto|scroll|overlay)/.test(s.overflowY)&&n.scrollHeight>n.clientHeight+1){if(direction<0&&n.scrollTop>1)return true;if(direction>0&&n.scrollTop+n.clientHeight<n.scrollHeight-1)return true}n=n.parentElement}return false}function onWheel(e){const d=e.deltaY>0?1:-1;if(scrollPathCanMove(e.target,d)){wheel={candidate:null,inward:0,lastOutAt:0};return}e.preventDefault();if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;if(d<0){const candidate=hovered?.node?.nodeKey||null;if(candidate!==wheel.candidate){wheel.candidate=candidate;wheel.inward=0}wheel.inward+=Math.abs(e.deltaY);pixelScale=Math.min(1.28,pixelScale+Math.abs(e.deltaY)*.00065);applyScale();if(candidate&&wheel.inward>430)travel(candidate,hovered.relationshipKinds[0],'action.terrain.semantic-zoom-in');return}wheel.candidate=null;wheel.inward=0;pixelScale=Math.max(.72,pixelScale-Math.abs(e.deltaY)*.00055);applyScale();if(pixelScale>.721)return;const now=performance.now();if(!wheel.lastOutAt||now-wheel.lastOutAt>3000){wheel.lastOutAt=now;showHint('Outer boundary reached · release, then scroll again to return one semantic step');return}if(now-wheel.lastOutAt<220)return;wheel.lastOutAt=0;session.back({commandRef:`command.terrain.out.${++seq}`}).then(r=>{if(r.state==='COMMITTED'){pixelScale=1;syncUrl(r.frame);render()}else showHint('Terrain root reached')})}
function hits(q){q=q.trim().toLowerCase();if(!q)return[];const out=[];for(const p of workspace.projects){if([p.project.label,p.project.purpose,p.project.projectRef].some(v=>String(v).toLowerCase().includes(q)))out.push({key:`project:${p.project.projectRef}`,label:p.project.label,meta:p.project.projectRef});for(const i of p.items)if([i.label,i.purpose,i.workRef,i.state].some(v=>String(v).toLowerCase().includes(q)))out.push({key:`work:${p.project.projectRef}:${i.workRef}`,label:i.label,meta:`${p.project.label} · ${i.state}`})}return out.slice(0,18)}function renderSearch(){const found=hits(search.value);searchResults.replaceChildren();searchResults.hidden=!search.value.trim();found.forEach(h=>{const b=el('button','result');b.type='button';b.append(el('strong','',h.label),el('small','',h.meta));b.onclick=()=>{search.value='';searchResults.hidden=true;travel(h.key,RELATIONSHIP.SEARCH_PORTAL,'action.terrain.search-portal')};searchResults.append(b)})}
document.getElementById('inspectToggle').onclick=()=>inspect.classList.toggle('open');document.getElementById('historyToggle').onclick=()=>historyPanel.classList.toggle('open');search.oninput=renderSearch;stage.addEventListener('wheel',onWheel,{passive:false});window.onresize=render;window.addEventListener('popstate',()=>{if(!workspace)return;session=createTerrainSession({workspace,initialNodeKey:keyFromUrl()});pixelScale=1;render()});fetch(WORKSPACE_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(data=>{if(data?.schemaVersion!=='vexwork.public-workspace/v1'||data.effects!==false||data.executionAuthority!=='NONE')throw new Error('workspace projection boundary invalid');workspace=data;session=createTerrainSession({workspace,initialNodeKey:keyFromUrl()});syncUrl(session.currentFrame(),{replace:true});render()}).catch(err=>{summary.textContent=err.message;showHint('Terrain unavailable; canonical VexWork truth is unchanged')});
</script></body></html>
