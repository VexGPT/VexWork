e-space:nowrap}.chip.open{background:#eff6ff;color:#1d4ed8}.chip.done{background:#f0fdf4;color:var(--green)}.chip.waiting{background:#fffbeb;color:var(--amber)}.chip.blocked{background:#fef2f2;color:var(--red)}.preview-strip{min-width:0;border-left:1px solid var(--line);display:flex;align-items:stretch;gap:5px;padding:7px;overflow:hidden}.preview{border:1px solid transparent;border-radius:8px;background:#f7f7f5;color:var(--ink);padding:7px 8px;text-align:left;min-width:0;flex:1 1 0;overflow:hidden;position:relative}.preview[data-tone="open"]{background:#eff6ff;border-color:#dbeafe}.preview[data-tone="done"]{background:#f0fdf4;border-color:#dcfce7}.preview[data-tone="attention"]{background:#fffbeb;border-color:#fde68a}.preview[data-tone="waiting"]{background:#fffdf5;border-color:#f5e9c8}.preview[data-tone="blocked"]{background:#fef2f2;border-color:#fecaca}.preview[data-tone="pending"]{background:#f7f7f5;border-color:#e7e5e4}.preview[data-continuity="current"]{box-shadow:inset 3px 0 0 #2563eb}.preview[data-continuity="prior"]{box-shadow:inset 3px 0 0 #16a34a}.preview[data-continuity="next"]{box-shadow:inset 3px 0 0 #d97706}.preview[data-continuity="latest"]{box-shadow:inset 3px 0 0 #16a34a}.preview:hover{border-color:#93c5fd}.preview strong{display:block;font-size:10px;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview small{display:block;margin-top:4px;color:var(--muted);font:8px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.continuity-mark{display:block;margin-bottom:4px;color:var(--faint);font:700 7px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.09em}.preview[data-continuity="current"] .continuity-mark{color:#1d4ed8}.preview[data-continuity="prior"] .continuity-mark,.preview[data-continuity="latest"] .continuity-mark{color:#15803d}.preview[data-continuity="next"] .continuity-mark{color:#b45309}.preview-more{flex:0 0 auto;align-self:center;color:var(--faint);font:8px ui-monospace .focus-layout{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:8px}.context-strip{display:flex;gap:6px;min-width:0;overflow:hidden}.context-pill{border:1px solid var(--line);background:#fafaf9;border-radius:999px;padding:5px 8px;color:var(--muted);font:8px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.context-pill.current{border-color:#bfdbfe;color:#1d4ed8;background:#eff6ff}.focus-head{border:1px solid #bfdbfe;border-radius:13px;background:#fbfdff;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.focus-head h1{margin:4px 0 4px;font:700 clamp(24px,3vw,38px)/1 Georgia,"Times New Roman",serif;letter-spacing:-.02em}.focus-head .purpose{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.focus-actions{display:flex;gap:6px}.tool{border:1px solid #d6d3d1;border-radius:8px;background:#fff;padding:7px 9px;color:var(--ink);font-size:9px}.tool:hover,.tool:focus-visible{border-color:#93c5fd;outline:none}.strata-shell{min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.strata-list{min-height:0;overflow:auto;overscroll-behavior:contain;padding-right:3px}.stratum{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:7px;display:grid;grid-template-columns:minmax(210px,38%) minmax(0,1fr);overflow:hidden}.stratum[data-tone="open"]{background:#f8fbff;border-color:#dbeafe}.stratum[data-tone="done"]{background:#f8fff9;border-color:#dcfce7}.stratum[data-tone="attention"]{background:#fffdf5;border-color:#fde68a}.stratum[data-tone="waiting"]{background:#fffefa;border-color:#f5e9c8}.stratum[data-tone="blocked"]{background:#fff8f8;border-color:#fecaca}.stratum[data-continuity="current"]{box-shadow:inset 4px 0 0 #2563eb}.stratum[data-continuity="prior"]{box-shadow:inset 4px 0 0 #16a34a}.stratum[data-continuity="next"]{box-shadow:inset 4px 0 0 #d97706}.stratum:hover{border-color:#93c5fd}.stratum-main{border:0;background:transparent;padding:10px 12px;text-align:left;color:inherit;min-width:0}.stratum-title{font-weight:740;font-size:13px;line-height:1.12;margin:3px 0 4px}.stratum .purpose{font-size:9px}.stratum-next{min-width:0;border-left:1px solid var(--line);padding:7px;display:flex;gap:5px;align-items:center;overflow:hidden;background:#fcfcfb}.leaf .stratum-next{color:var(--faint);font:8px ui-monospace,monospace}.empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:30px}.results{position:absolute;right:14px;top:62px;z-index:30;width:min(430px,90vw);max-height:55vh;overflow:auto;border:1px solid #d6d3d1;border-radius:10px;background:#fff;padding:5px;box-shadow:0 12px 32px rgba(28,25,23,.12)}.results[hidden]{display:none}.result{display:block;width:100%;border:0;border-radius:7px;background:transparent;padding:9px;text-align:left}.result:hover{background:#eff6ff}.result strong,.result small{display:block}.result small{margin-top:3px;color:var(--muted);font:8px ui-monospace,monospace}.inspect{position:absolute;right:14px;top:14px;bottom:14px;z-index:20;width:min(390px,42vw);border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.98);padding:12px;overflow:auto;transform:translateX(calc(100% + 30px));transition:transform .16s ease}.inspect.open{transform:none}.inspect-head{position:sticky;top:-12px;z-index:2;margin:-12px -12px 8px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.98);display:flex;align-items:center;justify-content:space-between;gap:12px}.inspect-head strong{font:700 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}.inspect-close{border:1px solid #d6d3d1;border-radius:7px;background:#fff;padding:5px 8px;font-size:9px}.inspect-close:hover,.inspect-close:focus-visible{border-color:#93c5fd;outline:none}.inspect h4{margin:14px 0 6px;font:700 8px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}.inspect code{display:block;white-space:pre-wrap;word-break:break-word;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fafaf9;font:9px/1.45 ui-monospace,monospace}.journey{position:absolute;left:14px;right:14px;bottom:14px;z-index:18;display:none;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.96);padding:9px}.journey.open{display:block}.journey-track{display:flex;gap:6px;overflow:auto}.event{flex:0 0 auto;max-width:210px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;text-align:left}.event strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event small{display:block;margin-top:3px;color:var(--faint);font:8px ui-monospace,monospace}.hint{position:absolute;left:50%;bottom:14px;z-index:25;transform:translateX(-50%);border:1px solid #d6d3d1;border-radius:999px;background:#fff;padding:7px 10px;color:var(--muted);font:9px ui-monospace,monospace}.hint[hidden]{display:none}

<body>
<div class="app">
  <div class="top"><div class="shell">
    <nav class="family" aria-label="Vextreme, VexLife, and VexWork homes"><a href="https://vgong24.github.io/Vextreme/pages/terrain-map.html?view=content&amp;profile=evolution-v1">Vextreme</a><span class="sep">/</span><a href="https://vgong24.github.io/VexLife/">VexLife</a><span class="sep">/</span><a class="current" href="./">VexWork</a></nav>
    <div class="bar"><div class="brand"><a href="./"><strong>VexWork</strong></a><span>Terrain Map</span><em>experimental v2</em></div><input id="search" class="search" type="search" placeholder="Travel to a Project or work ref…" aria-label="Find Terrain destination"></div>
  </div></div>
  <main class="stage" id="stage">
    <div class="terrain">
      <div class="orientation"><strong id="orientationTitle">VexWork</strong><span id="orientationSummary">Loading read-only workspace…</span><small id="orientationMeta">depth is level-of-detail</small></div>
      <section class="surface"><div id="surface" class="surface-inner"></div></section>
    </div>
    <div id="searchResults" class="results" hidden></div>
    <aside id="inspect" class="inspect" aria-label="Current Terrain context"></aside>
    <section id="journey" class="journey" aria-label="Explicit Terrain journey"><div id="journeyTrack" class="journey-track"></div></section>
    <div id="hint" class="hint" role="status" hidden></div>
  </main>
</div>
<script type="module">
import {RELATIONSHIP,createTerrainSession,structuralPath} from './terrain-reader.js';

const WORKSPACE_URL='./public/workspace.json';
const ACTIVE=new Set(['CONTEXT_ADMITTED','RUNNING','WAITING_TOOL']);
const REVIEW=new Set(['VERIFYING','WAITING_HUMAN','HELD_UNKNOWN']);
const WAITING=new Set(['WAITING_DEPENDENCIES','WAITING_RESOURCE','PAUSED_AT_CHECKPOINT']);
const DONE=new Set(['COMPLETED','CONVERGED','CLOSED']);
const BLOCKED=new Set(['BLOCKED','FAILED_RECOVERABLE']);
const PENDING=new Set(['CAPTURED','NEEDS_CLARIFICATION','DECOMPOSED','PLAN_VALIDATED']);
const ARCHIVE=new Set(['SUPERSEDED','CANCELLED']);
const SEMANTIC_WHEEL_TRAVERSAL_ENABLED=false;

let workspace=null;
let session=null;
let cameraPath=[];
let hoveredKey=null;
let wheel={candidate:null,inward:0,outwardAt:0};
let seq=0;

const surface=document.getElementById('surface');
const stage=document.getElementById('stage');
const search=document.getElementById('search');
const results=document.getElementById('searchResults');
const inspect=document.getElementById('inspect');
const journey=document.getElementById('journey');
const journeyTrack=document.getElementById('journeyTrack');
const hint=document.getElementById('hint');
const orientationTitle=document.getElementById('orientationTitle');
const orientationSummary=document.getElementById('orientationSummary');
const orientationMeta=document.getElementById('orientationMeta');

const el=(tag,cls,text='')=>{const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=String(text);return n};
function tone(state){if(DONE.has(state))return'done';if(BLOCKED.has(state))return'blocked';if(REVIEW.has(state))return'attention';if(WAITING.has(state))return'waiting';if(PENDING.has(state)||ARCHIVE.has(state))return'pending';return'open'}
function currentLike(state){return ACTIVE.has(state)||REVIEW.has(state)||BLOCKED.has(state)}
function stateEvidence(item){const history=item?.transitionHistory||[];const exact=[...history].reverse().find((entry)=>entry.nextState===item.state);if(exact?.createdAt)return{at:exact.createdAt,coverage:'transition',actorRef:exact.actorRef||null};if(item?.updatedAt)return{at:item.updatedAt,coverage:'snapshot',actorRef:null};return null}
function ageText(iso){const at=Date.parse(iso);if(!Number.isFinite(at))return'unknown';const minutes=Math.max(0,Math.floor((Date.now()-at)/60000)),hours=Math.floor(minutes/60),mins=minutes%60;return String(hours).padStart(2,'0')+':'+String(mins).padStart(2,'0')+' ago'}
function stateAgeText(item){const evidence=stateEvidence(item);if(!evidence)return item.state+' · time unknown';return item.state+' · '+(evidence.coverage==='snapshot'?'snapshot ':'')+ageText(evidence.at)}
function addAgeData(node,item){const evidence=stateEvidence(item);if(evidence){node.dataset.stateAt=evidence.at;node.dataset.stateCoverage=evidence.coverage;node.dataset.stateName=item.state}}
function refreshAges(){document.querySelectorAll('[data-state-at]').forEach((node)=>{const coverage=node.dataset.stateCoverage==='snapshot'?'snapshot ':'';node.textContent=node.dataset.stateName+' · '+coverage+ageText(node.dataset.stateAt)})}
function continuityWindow(items,max=6){
  if(!items.length)return[];
  const anchors=[];
  items.forEach((item,index)=>{if(currentLike(item.state))anchors.push(index)});
  if(!anchors.length){items.forEach((item,index)=>{if(item.state==='READY')anchors.push(index)})}
  let latestIndex=-1;
  if(!anchors.length){let latest=-Infinity;items.forEach((item,index)=>{if(!DONE.has(item.state))return;const evidence=stateEvidence(item);const at=evidence?Date.parse(evidence.at):NaN;if(Number.isFinite(at)&&at>latest){latest=at;latestIndex=index}});if(latestIndex>=0)anchors.push(latestIndex)}
  if(!anchors.length)anchors.push(0);
  const roles=new Map();
  for(const index of anchors){roles.set(index,currentLike(items[index].state)?'current':(DONE.has(items[index].state)?'latest':'current'));if(index>0&&!roles.has(index-1))roles.set(index-1,'prior');if(index+1<items.length&&!roles.has(index+1))roles.set(index+1,'next')}
  let indices=[...roles.keys()].sort((a,b)=>a-b);
  if(indices.length>max){const currentIndices=new Set(anchors);indices=indices.sort((a,b)=>{const ac=currentIndices.has(a)?0:1,bc=currentIndices.has(b)?0:1;return ac-bc||a-b}).slice(0,max).sort((a,b)=>a-b)}
  return indices.map((index)=>({item:items[index],role:roles.get(index)||''}));
}
function continuityRoles(items){return new Map(continuityWindow(items,items.length).map(({item,role})=>[item.workRef,role]))}
function showHint(text){hint.textContent=text;hint.hidden=false;clearTimeout(showHint.t);showHint.t=setTimeout(()=>hint.hidden=true,2200)}
function projectByRef(ref){return workspace.projects.find(p=>p.project.projectRef===ref)||null}
function itemByRef(project,ref){return(project?.items||[]).find(i=>i.workRef===ref)||null}
function nodeKeyFor(project,item){return item?`work:${project.project.projectRef}:${item.workRef}`:`project:${project.project.projectRef}`}
function parseKey(key){
  if(key==='workspace:vexwork')return{kind:'WORKSPACE',project:null,item:null};
  if(key.startsWith('project:')){const project=projectByRef(key.slice(8));return{kind:'PROJECT',project,item:null}}
  if(key.startsWith('work:')){
    const body=key.slice(5),i=body.indexOf(':work.');
    const project=projectByRef(body.slice(0,i)),item=itemByRef(project,body.slice(i+1));
    return{kind:'WORK',project,item};
  }
  return{kind:'UNKNOWN',project:null,item:null};
}
function cameraKey(){return cameraPath.at(-1)||'workspace:vexwork'}
function pathForKey(key){return structuralPath(workspace,key).slice(1).map(n=>n.nodeKey)}
function keyFromUrl(){const p=new URLSearchParams(location.search),project=p.get('project'),work=p.get('work');return work&&project?`work:${project}:${work}`:project?`project:${project}`:'workspace:vexwork'}
function syncUrlForExplicit(key,{replace=false}={}){const p=parseKey(key),u=new URL(location.href);u.search='';if(p.project)u.searchParams.set('project',p.project.project.projectRef);if(p.item)u.searchParams.set('work',p.item.workRef);history[replace?'replaceState':'pushState']({vexworkTerrain:true},'',u)}
function childrenFor(key){
  const p=parseKey(key);
  if(p.kind==='WORKSPACE')return workspace.projects.map(project=>({key:nodeKeyFor(project,null),project,item:null}));
  if(p.kind==='PROJECT')return p.project.project.rootWorkRefs.map(ref=>itemByRef(p.project,ref)).filter(Boolean).map(item=>({key:nodeKeyFor(p.project,item),project:p.project,item}));
  if(p.kind==='WORK')return(p.item.childWorkRefs||[]).map(ref=>itemByRef(p.project,ref)).filter(Boolean).map(item=>({key:nodeKeyFor(p.project,item),project:p.project,item}));
  return[];
}
function surfaceItemsForProject(project){
  const roots=project.project.rootWorkRefs.map(ref=>itemByRef(project,ref)).filter(Boolean);
  if(roots.length===1){
    const child=(roots[0].childWorkRefs||[]).map(ref=>itemByRef(project,ref)).filter(Boolean);
    if(child.length)return child;
  }
  return roots;
}
function chip(state,label=state){const n=el('span','chip '+tone(state),label);return n}
function previewButton(project,item,role=''){
  const b=el('button','preview');b.type='button';b.dataset.nodeKey=nodeKeyFor(project,item);b.dataset.tone=tone(item.state);if(role)b.dataset.continuity=role;
  if(role)b.append(el('span','continuity-mark',role==='latest'?'latest completed':role));
  const status=el('small','state-age',stateAgeText(item));addAgeData(status,item);
  b.append(el('strong','',item.label),status);
  b.onmouseenter=()=>hoveredKey=b.dataset.nodeKey;b.onmouseleave=()=>{if(hoveredKey===b.dataset.nodeKey)hoveredKey=null};
  b.onclick=(e)=>{e.stopPropagation();explicitEnter(b.dataset.nodeKey,RELATIONSHIP.CONTAINS,'action.terrain.click')};
  return b;
}
function appendPreviewStrip(container,project,items,max=6){
  const windowItems=continuityWindow(items,max);
  windowItems.forEach(({item,role})=>container.append(previewButton(project,item,role)));
  if(items.length>windowItems.length)container.append(el('span','preview-more',`+${items.length-windowItems.length} outside continuity`));
  if(!items.length)container.append(el('span','preview-more','no deeper work'));
}
function projectBand(project,index){
  const band=el('article','project-band');band.dataset.nodeKey=nodeKeyFor(project,null);
  const lead=el('button','project-lead');lead.type='button';lead.append(el('div','eyebrow',`Project ${index+1}`),el('div','project-title',project.project.label),el('div','purpose',project.project.purpose));
  const meta=el('div','band-meta'),root=project.rootItems?.[0]||null;
  if(root?.state){meta.append(chip(root.state));const age=el('span','chip',stateAgeText(root));addAgeData(age,root);meta.append(age)}
  meta.append(el('span','chip',`${project.summary.openWorkItemCount} open`),el('span','chip',`${project.summary.completedCount} done`));lead.append(meta);
  lead.onmouseenter=()=>hoveredKey=band.dataset.nodeKey;lead.onmouseleave=()=>{if(hoveredKey===band.dataset.nodeKey)hoveredKey=null};
  lead.onclick=()=>explicitEnter(band.dataset.nodeKey,RELATIONSHIP.PROJECT,'action.terrain.click');
  const previews=el('div','preview-strip');appendPreviewStrip(previews,project,surfaceItemsForProject(project),6);
  band.append(lead,previews);return band;
}
function contextTrail(){
  const wrap=el('div','context-strip');
  const keys=['workspace:vexwork',...cameraPath];
  keys.forEach((key,index)=>{const p=parseKey(key),label=key==='workspace:vexwork'?'VexWork':p.kind==='PROJECT'?p.project.project.label:p.item?.label||key;const b=el('button','context-pill'+(index===keys.length-1?' current':''),label);b.type='button';b.onclick=()=>{cameraPath=index===0?[]:cameraPath.slice(0,index);render()};wrap.append(b)});
  return wrap;
}
function siblingContext(){
  if(!cameraPath.length)return null;
  const parentKey=cameraPath.length===1?'workspace:vexwork':cameraPath.at(-2);
  const current=cameraKey(),siblings=childrenFor(parentKey);
  const wrap=el('div','context-strip');
  siblings.slice(0,12).forEach(s=>{const label=s.item?s.item.label:s.project.project.label;const b=el('button','context-pill'+(s.key===current?' current':''),label);b.type='button';b.onclick=()=>{cameraPath=[...cameraPath.slice(0,-1),s.key];render()};wrap.append(b)});

function renderWorkspace(){

function renderFocus(){
  const key=cameraKey(),parsed=parseKey(key),children=childrenFor(key);

  const sib=siblingContext();if(sib)layout.append(sib);
  const head=el('header','focus-head'),copy=el('div','');

  const purpose=parsed.kind==='PROJECT'?parsed.project.project.purpose:parsed.item.purpose;

function render(){if(!workspace)return;if(cameraPath.length)renderFocus();else renderWorkspace();renderInspect();renderJourney()}
function cameraEnter(key){if(!key||key===cameraKey())return;const direct=childrenFor(cameraKey()).some(x=>x.key===key);if(!direct)return;cameraPath.push(key);wheel={candidate:null,inward:0,outwardAt:0};render()}

async function explicitEnter(key,relationshipKind,actionRef){
  const current=session.currentFrame().focus.nodeKey;
  let result;
  if(current===key){result={state:'ALREADY_PRESENT'}}else{
    try{result=await session.navigate(key,relationshipKind,{commandRef:`command.terrain.explicit.${++seq}`,actionRef})}
    catch{result=await session.navigate(key,RELATIONSHIP.SEARCH_PORTAL,{commandRef:`command.terrain.portal.${++seq}`,actionRef:'action.terrain.explicit-portal'})}
  }
  cameraPath=pathForKey(key);syncUrlForExplicit(key);render();if(result.state==='DUPLICATE_EXACT_NOOP')showHint('Already represented in explicit Journey')

function scrollPathCanMove(target,direction){
  let n=target?.nodeType===1?target:target?.parentElement;
  while(n&&n!==document.body){
    const s=getComputedStyle(n);
    if(/(auto|scroll|overlay)/.test(s.overflowY)&&n.scrollHeight>n.clientHeight+1){
      if(direction<0&&n.scrollTop>1)return true;
      if(direction>0&&n.scrollTop+n.clientHeight<n.scrollHeight-1)return true;
    }
    n=n.parentElement;
  }
  return false;
}
function onWheel(e){

  const direction=e.deltaY>0?1:-1;
  if(scrollPathCanMove(e.target,direction)){wheel={candidate:null,inward:0,outwardAt:0};return}
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  e.preventDefault();
  if(direction<0){
    const candidate=hoveredKey;
    if(candidate!==wheel.candidate){wheel.candidate=candidate;wheel.inward=0}
    wheel.inward+=Math.abs(e.deltaY);
    if(candidate&&wheel.inward>360){cameraEnter(candidate);showHint('More detail revealed · semantic Journey unchanged')}
    return;
  }
  wheel.candidate=null;wheel.inward=0;
  const now=performance.now();
  if(!wheel.outwardAt||now-wheel.outwardAt>3000){wheel.outwardAt=now;showHint('Outer boundary reached · release, then scroll again to reveal less detail');return}
  const gap=now-wheel.outwardAt;wheel.outwardAt=now;if(gap<220)return;wheel.outwardAt=0;cameraOut();
}
function renderInspect(){

  inspect.append(el('h4','','Perceptual context'),el('code','',`Camera focus: ${semanticRef}\nCamera depth: ${cameraPath.length}\n\nZooming through containment does not append semantic Journey history.`));
  if(p.kind==='WORK'){
    const evidence=stateEvidence(p.item),actors=[...new Set((p.item.transitionHistory||[]).map((entry)=>entry.actorRef).filter(Boolean))],handoffs=(p.item.transitionHistory||[]).reduce((count,entry,index,history)=>index>0&&entry.actorRef&&history[index-1].actorRef&&entry.actorRef!==history[index-1].actorRef?count+1:count,0);
    inspect.append(el('h4','','State'),el('code','',`${p.item.state}\n${p.item.priorityClass}\n${p.item.workClass}\n${evidence?stateAgeText(p.item):'time unknown'}`),el('h4','','Participation evidence'),el('code','',actors.length?`Recorded lifecycle actors: ${actors.length}\nRecorded actor handoffs: ${handoffs}\n${actors.join('\n')}\n\nCoverage: accepted lifecycle transitions only; this is not a total worker/thread count.`:'No transition actors recorded.\n\nCoverage: current Workgraph does not yet model total worker/thread participation.'),el('h4','','Dependencies'),el('code','',(p.item.dependencyRefs||[]).join('\n')||'None'),el('h4','','Sources'),el('code','',(p.item.sourceRefs||[]).join('\n')||'None'));
  }else if(p.kind==='PROJECT'){
    inspect.append(el('h4','','Project'),el('code','',`${p.project.project.projectRef}\n${p.project.summary.openWorkItemCount} open\n${p.project.summary.completedCount} completed`));
  }

}
function renderJourney(){

function hits(q){
