<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VexWork — Work Navigator</title>
<meta name="description" content="Read-only semantic navigator for VexWork Projects, Outcomes, dependencies, Boards and work-item state history.">
<style>
:root{--blue:#2563eb;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--wash:#fafaf9;--paper:#fff;--ember:#b45830}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
.shell{width:min(1460px,calc(100% - 28px));margin:0 auto}.family{display:flex;align-items:center;gap:8px;padding:20px 0 15px;font-family:Georgia,"Times New Roman",serif;font-size:15px}.family a{color:var(--muted);text-decoration:none}.family strong{font-weight:700}.sep{color:#d6d3d1;font-family:ui-monospace,monospace;font-size:11px}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,420px);gap:20px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}.brand{display:flex;align-items:baseline;gap:14px}.brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:31px;letter-spacing:-.03em}.readonly{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
.search{width:100%;border:1px solid #d6d3d1;border-radius:9px;background:#f2f2f0;padding:12px 14px;color:var(--ink)}.search:focus{outline:2px solid rgba(37,99,235,.25);border-color:var(--blue)}
.levels{display:flex;align-items:center;gap:8px;padding:12px 0;font-family:ui-monospace,monospace;font-size:10px;color:#a8a29e}.level{padding:5px 8px;border-radius:999px;border:1px solid transparent}.level.current{color:var(--blue);border-color:#bfdbfe;background:#eff6ff}.level-sep{color:#d6d3d1}
main{min-height:72vh;padding:26px 0 60px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:24px}.eyebrow{margin:0 0 8px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}.hero h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,5vw,58px);line-height:1;margin:0;letter-spacing:-.035em}.lede{max-width:820px;color:var(--muted);line-height:1.65;margin:13px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid #d6d3d1;background:#fff;border-radius:8px;padding:9px 12px;color:var(--ink)}.btn:hover,.btn:focus-visible{border-color:#93c5fd;outline:none}.quiet{background:transparent}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0 28px}.stat{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px 16px}.stat strong{display:block;font-family:ui-monospace,monospace;font-size:22px;color:var(--ember)}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:11px;background:#fff;padding:16px;min-width:0}.card.clickable{cursor:pointer}.card.clickable:hover,.card.clickable:focus-visible{border-color:#93c5fd;box-shadow:0 7px 24px rgba(37,99,235,.07);outline:none}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{display:inline-flex;align-items:center;border-radius:999px;background:#f1f0ee;padding:3px 7px;font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:#78716c}.chip.state{background:#fff4ef;color:var(--ember)}.chip.blue{background:#eff6ff;color:var(--blue)}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.ref{margin-top:12px;font-family:ui-monospace,monospace;font-size:8px;color:#a8a29e;overflow-wrap:anywhere}.foot{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:14px}.countline,.rel{font-family:ui-monospace,monospace;font-size:9px;color:var(--muted)}
.section{margin-top:34px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin-bottom:12px}.section-head h3{margin:0;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.section-head p{margin:0;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:20px 0;border-bottom:1px solid var(--line);padding-bottom:8px}.tab{border:0;background:transparent;border-radius:7px;padding:8px 11px;color:var(--muted)}.tab.current{background:#eff6ff;color:var(--blue);font-weight:600}
.tree{display:grid;gap:10px}.tree-node{border-left:2px solid #dbeafe;padding-left:12px}.tree-node[data-depth="0"]{border-left-color:var(--blue);padding-left:15px}.tree-node>.card{margin-bottom:8px}.tree-children{display:grid;gap:8px;margin-left:20px}
.board-scroll{overflow-x:auto;padding-bottom:10px}.board{display:grid;grid-template-columns:repeat(10,240px);gap:9px;min-width:max-content;align-items:start}.lane{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.65);min-height:120px}.lane-head{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line);font-family:ui-monospace,monospace;font-size:9px;text-transform:uppercase}.lane-body{display:grid;gap:7px;padding:7px}.lane .card{padding:11px}.empty{padding:12px;color:#a8a29e;font-size:11px;font-style:italic}
.deps{display:grid;gap:8px}.dep-row{display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px}.arrow{font-family:ui-monospace,monospace;color:var(--blue)}
.detail{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.8fr);gap:20px}.panel{border:1px solid var(--line);border-radius:10px;background:#fff;padding:18px}.panel h3{margin:0 0 13px}.fields{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 14px;font-size:12px}.field-label{font-family:ui-monospace,monospace;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.05em}.field-value{overflow-wrap:anywhere}.ref-list{display:flex;flex-wrap:wrap;gap:5px}.ref-token{font-family:ui-monospace,monospace;font-size:9px;background:#f5f5f4;border-radius:5px;padding:4px 6px;overflow-wrap:anywhere}
.history{display:grid;gap:9px}.history-entry{border-left:2px solid #bfdbfe;padding:8px 0 8px 13px}.history-entry strong{font-size:12px}.history-entry p{margin:5px 0 0;color:var(--muted);font-size:11px}.history-entry time{font-family:ui-monospace,monospace;font-size:8px;color:#a8a29e}
.breadcrumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:11px}.breadcrumb button{border:0;background:transparent;color:var(--blue);padding:0}.breadcrumb span{color:#a8a29e}.ai-hint{margin-top:18px;border:1px dashed #bfdbfe;background:#f8fbff;border-radius:9px;padding:12px;color:#475569;font-size:11px;line-height:1.5}.ai-hint code{font-family:ui-monospace,monospace;color:var(--blue)}
.status{margin-top:26px;padding:13px 15px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:11px}.error{color:#9f3131}.footer{border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;padding:18px 0 30px;font-family:ui-monospace,monospace;font-size:8px;color:#a8a29e}
@media(max-width:820px){.toolbar,.hero,.detail{grid-template-columns:1fr}.actions{justify-content:flex-start}.stats{grid-template-columns:1fr 1fr}.board{display:flex;flex-direction:column;min-width:0}.lane{width:100%}.board-scroll{overflow:visible}.dep-row{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:start}.fields{grid-template-columns:1fr}.tree-children{margin-left:8px}.footer{flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<nav class="family" aria-label="Vextreme, VexLife, and VexWork homes">
<a href="https://vgong24.github.io/Vextreme/">Vextreme</a><span class="sep" aria-hidden="true">/</span>
<a href="https://vgong24.github.io/VexLife/">VexLife</a><span class="sep" aria-hidden="true">/</span>
<strong aria-current="page">VexWork</strong>
</nav>
<div class="toolbar">
<div class="brand"><h1>VexWork</h1><span class="readonly">read-only projection</span></div>
<label><span class="field-label">Find work</span><input id="search" class="search" type="search" placeholder="Find a Project, Outcome, task, defect or work ref…"></label>
</div>
<div class="levels" aria-label="VexWork semantic level">
<span class="level" data-level="PROJECTS">Projects</span><span class="level-sep">→</span>
<span class="level" data-level="PROJECT">Project</span><span class="level-sep">→</span>
<span class="level" data-level="ITEM">Work item</span>
</div>
<main id="app" aria-live="polite"></main>
<div class="status" id="status" role="status">Loading public VexWork workspace…</div>
<footer class="footer"><span>VEXWORK VIEW · VEXWORK TRUTH OWNER</span><span>effects=false · executionAuthority=NONE</span></footer>
</div>
<script type="module">
import * as Reader from './workspace-reader.js';

const WORKSPACE_URL = './public/workspace.json';
const app = document.getElementById('app');
const status = document.getElementById('status');
const search = document.getElementById('search');
let workspace = null;

function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined&&text!==null)n.textContent=String(text);return n}
function chip(text,extra){return el('span','chip'+(extra?' '+extra:''),text)}
function clear(node){node.replaceChildren()}
function action(text,handler){const b=el('button','btn quiet',text);b.type='button';b.addEventListener('click',handler);return b}
function setLevel(level){document.querySelectorAll('.level').forEach((n)=>{const current=n.dataset.level===level;n.classList.toggle('current',current);n.setAttribute('aria-current',current?'step':'false')})}
function currentRoute(){return Reader.parseRoute(location.search)}
function navigate(next,replace=false){const url=location.pathname+Reader.routeSearch(next);(replace?history.replaceState:history.pushState).call(history,{vexwork:true},'',url);search.value='';render()}
function projectOf(ref){return Reader.projectByRef(workspace,ref)}
function itemOf(project,ref){return Reader.itemByRef(project,ref)}
function rootState(project){const roots=Reader.projectRootItems(project);return roots.length===1?roots[0].state:(roots.length+' roots')}
function cardForItem(project,item,clickable=true){
  const card=el('article','card'+(clickable?' clickable':''));if(clickable){card.tabIndex=0;card.setAttribute('role','button')}
  const meta=el('div','meta');meta.append(chip(item.state,'state'),chip(item.workClass),chip(item.priorityClass));card.appendChild(meta)
  card.append(el('h3','',item.label),el('p','',item.purpose))
  const foot=el('div','foot');foot.append(el('span','countline',(item.childWorkRefs||[]).length+' children · '+(item.dependencyRefs||[]).length+' dependencies'),el('span','rel',(item.repositoryRefs||[]).join(' · ')));card.appendChild(foot)
  card.appendChild(el('div','ref',item.workRef))
  if(clickable){const open=()=>navigate({projectRef:project?.project.projectRef||null,workRef:item.workRef,view:'overview'});card.addEventListener('click',open);card.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})}
  return card
}
function hero(eyebrow,title,lede,actions=[]){const wrap=el('section','hero'),copy=el('div'),buttons=el('div','actions');copy.append(el('p','eyebrow',eyebrow),el('h2','',title),el('p','lede',lede));actions.forEach((b)=>buttons.appendChild(b));wrap.append(copy,buttons);return wrap}
function stats(rows){const grid=el('div','stats');rows.forEach(([value,label])=>{const s=el('div','stat');s.append(el('strong','',value),el('span','',label));grid.appendChild(s)});return grid}
function sectionHead(title,copy=''){const h=el('div','section-head');h.append(el('h3','',title),el('p','',copy));return h}
function projectCard(project){const card=el('article','card clickable');card.tabIndex=0;card.setAttribute('role','button');const meta=el('div','meta');meta.append(chip(rootState(project),'state'),chip(project.summary.outcomeCount+' outcomes','blue'));card.appendChild(meta);card.append(el('h3','',project.project.label),el('p','',project.project.purpose));const foot=el('div','foot');foot.append(el('span','countline',project.summary.workItemCount+' items · '+project.summary.openWorkItemCount+' open · '+project.summary.needsHumanCount+' needs human'),el('span','rel','Open Project →'));card.appendChild(foot);const open=()=>navigate({projectRef:project.project.projectRef,workRef:null,view:'story'});card.addEventListener('click',open);card.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});return card}
function tabs(values,current,onChange){const row=el('div','tabs');const labels={story:'Story Map',board:'Board',dependencies:'Dependencies',overview:'Overview',children:'Children',history:'State History'};values.forEach((value)=>{const b=el('button','tab'+(value===current?' current':''),labels[value]||value);b.type='button';b.setAttribute('aria-current',value===current?'page':'false');b.addEventListener('click',()=>onChange(value));row.appendChild(b)});return row}
function renderProjects(){setLevel('PROJECTS');clear(app);app.appendChild(hero('Portfolio','Projects','Enter through a durable human outcome. VexWork Projects group canonical Workgraph truth; this page only gives that truth a navigable shape.'));const total=workspace.projects.reduce((s,p)=>s+p.summary.workItemCount,0),open=workspace.projects.reduce((s,p)=>s+p.summary.openWorkItemCount,0),needs=workspace.projects.reduce((s,p)=>s+p.summary.needsHumanCount,0);app.appendChild(stats([[workspace.projects.length,'Projects'],[total,'Project work items'],[open,'Open work'],[needs,'Needs human']]));const sec=el('section','section');sec.appendChild(sectionHead('Projects','Choose a Project to enter its Story Map, Board or dependency view.'));const grid=el('div','grid');workspace.projects.forEach((p)=>grid.appendChild(projectCard(p)));sec.appendChild(grid);app.appendChild(sec);const park=el('section','section');park.appendChild(sectionHead('Parking Lot','Deferred work stays visible without becoming Project membership or implementation authority.'));const pg=el('div','grid');workspace.parkingLot.items.forEach((item)=>pg.appendChild(cardForItem(null,item,true)));park.appendChild(pg);app.appendChild(park)}
function treeNode(project,item,depth){const wrap=el('div','tree-node');wrap.dataset.depth=String(depth);wrap.appendChild(cardForItem(project,item));const kids=Reader.childItems(project,item.workRef);if(kids.length){const child=el('div','tree-children');kids.forEach((k)=>child.appendChild(treeNode(project,k,depth+1)));wrap.appendChild(child)}return wrap}
function renderStory(project){const tree=el('div','tree');Reader.projectRootItems(project).forEach((root)=>tree.appendChild(treeNode(project,root,0)));return tree}
function renderBoard(project){const scroll=el('div','board-scroll'),board=el('div','board'),byRef=new Map(project.items.map((i)=>[i.workRef,i]));project.lanes.forEach((lane)=>{const sec=el('section','lane'),head=el('div','lane-head');head.append(el('span','',lane.label),el('span','',lane.workRefs.length));sec.appendChild(head);const body=el('div','lane-body');if(!lane.workRefs.length)body.appendChild(el('div','empty','No work'));lane.workRefs.forEach((ref)=>body.appendChild(cardForItem(project,byRef.get(ref))));sec.appendChild(body);board.appendChild(sec)});scroll.appendChild(board);return scroll}
function renderDependencies(project){const wrap=el('div','deps'),byRef=new Map(project.items.map((i)=>[i.workRef,i]));let count=0;project.items.forEach((item)=>(item.dependencyRefs||[]).forEach((dep)=>{count+=1;const row=el('div','dep-row');row.append(cardForItem(project,item),el('div','arrow','depends on →'),byRef.get(dep)?cardForItem(project,byRef.get(dep)):el('div','card',dep));wrap.appendChild(row)}));if(!count)wrap.appendChild(el('div','empty','No dependencies inside this Project.'));return wrap}
function renderProject(route){const project=projectOf(route.projectRef);if(!project){navigate({projectRef:null,workRef:null,view:'story'},true);return}setLevel('PROJECT');clear(app);app.appendChild(hero('Project',project.project.label,project.project.purpose,[action('← All Projects',()=>navigate({projectRef:null,workRef:null,view:'story'}))]));app.appendChild(stats([[project.summary.workItemCount,'Work items'],[project.summary.openWorkItemCount,'Open'],[project.summary.completedCount,'Done / archived'],[project.summary.needsHumanCount,'Needs human']]));app.appendChild(tabs(Reader.PROJECT_VIEWS,route.view,(view)=>navigate({projectRef:project.project.projectRef,workRef:null,view})));app.appendChild(route.view==='board'?renderBoard(project):route.view==='dependencies'?renderDependencies(project):renderStory(project))}
function breadcrumb(project,item){const bar=el('nav','breadcrumb'),home=el('button','','Projects');home.type='button';home.addEventListener('click',()=>navigate({projectRef:null,workRef:null,view:'story'}));bar.append(home,el('span','','/'));if(project){const pb=el('button','',project.project.label);pb.type='button';pb.addEventListener('click',()=>navigate({projectRef:project.project.projectRef,workRef:null,view:'story'}));bar.append(pb,el('span','','/'));Reader.ancestorRefs(project,item.workRef).forEach((ref)=>{const a=itemOf(project,ref),b=el('button','',a?a.label:ref);b.type='button';b.addEventListener('click',()=>navigate({projectRef:project.project.projectRef,workRef:ref,view:'overview'}));bar.append(b,el('span','','/'))})}bar.append(el('span','',item.label));return bar}
function refs(values){const box=el('div','ref-list');(values||[]).forEach((value)=>box.appendChild(el('span','ref-token',value)));if(!values?.length)box.appendChild(el('span','empty','None'));return box}
function fieldGrid(item,project){const grid=el('div','fields');const add=(label,value)=>{grid.append(el('div','field-label',label),typeof value==='string'?el('div','field-value',value):value)};add('Work ref',item.workRef);add('Type',item.workClass);add('State',item.state);add('Priority',item.priorityClass);add('Project',project?project.project.label:'Parking Lot');add('Parent',item.parentWorkRefOrNull||'None');add('Authority',item.authorityDisposition);add('Effects',item.effectDisposition);add('Updated',item.updatedAt);add('Repositories',refs(item.repositoryRefs));add('Next process',refs(item.nextProcessRefs));add('Sources',refs(item.sourceRefs));return grid}
function renderChildren(project,item){const grid=el('div','grid'),kids=project?Reader.childItems(project,item.workRef):[];if(!kids.length)return el('div','empty','No child work.');kids.forEach((child)=>grid.appendChild(cardForItem(project,child)));return grid}
function renderItemDependencies(project,item){if(!project)return el('div','empty','This parked item is not inside a Project dependency view.');const wrap=el('div','section'),byRef=new Map(project.items.map((i)=>[i.workRef,i])),out=item.dependencyRefs||[],incoming=Reader.incomingDependencyRefs(project,item.workRef);wrap.appendChild(sectionHead('Depends on','Work this item cannot meaningfully advance without.'));const g1=el('div','grid');out.forEach((ref)=>g1.appendChild(byRef.get(ref)?cardForItem(project,byRef.get(ref)):el('div','card',ref)));if(!out.length)g1.appendChild(el('div','empty','No dependencies.'));wrap.appendChild(g1);wrap.appendChild(sectionHead('Depended on by','Work that names this item as a dependency.'));const g2=el('div','grid');incoming.forEach((ref)=>g2.appendChild(cardForItem(project,byRef.get(ref))));if(!incoming.length)g2.appendChild(el('div','empty','No incoming dependencies.'));wrap.appendChild(g2);return wrap}
function renderHistory(item){const list=el('div','history');if(!item.transitionHistory?.length)return el('div','empty','No recorded state transitions in this public Workgraph.');item.transitionHistory.forEach((h)=>{const entry=el('div','history-entry');entry.append(el('strong','',h.priorState+' → '+h.nextState),el('p','',h.reason||'No reason recorded.'),el('time','',h.createdAt+' · '+h.actorRef));list.appendChild(entry)});return list}
function renderItem(route){const located=Reader.locateItem(workspace,route.projectRef,route.workRef);if(!located){navigate({projectRef:route.projectRef,workRef:null,view:'story'},true);return}const project=located.project,item=located.item;setLevel('ITEM');clear(app);app.appendChild(breadcrumb(project,item));app.appendChild(hero(item.workClass+(located.parked?' · Parking Lot':''),item.label,item.purpose,[action(project?'← Project':'← Projects',()=>navigate({projectRef:project?.project.projectRef||null,workRef:null,view:'story'}))]));app.appendChild(tabs(Reader.ITEM_VIEWS,route.view,(view)=>navigate({projectRef:project?.project.projectRef||null,workRef:item.workRef,view})));if(route.view==='children')app.appendChild(renderChildren(project,item));else if(route.view==='dependencies')app.appendChild(renderItemDependencies(project,item));else if(route.view==='history')app.appendChild(renderHistory(item));else{const detail=el('div','detail'),main=el('section','panel'),side=el('aside','panel');main.append(el('h3','','Objective / description'),el('p','lede',item.purpose));const hint=el('div','ai-hint');hint.append('When talking to an AI about this work, use the exact context ref ',el('code','',item.workRef),'. VexWork stays read-only; the AI updates rightful work/source owners.');main.appendChild(hint);side.append(el('h3','','Details'),fieldGrid(item,project));detail.append(main,side);app.appendChild(detail)}}
function renderSearch(query){setLevel('PROJECTS');clear(app);const results=Reader.searchWorkspace(workspace,query);app.appendChild(hero('Search','Results for “'+query+'”','Search is presentation-only and does not change Workgraph truth or browser semantic history.',[action('Clear search',()=>{search.value='';render()})]));const ps=el('section','section');ps.appendChild(sectionHead('Projects',results.projects.length+' matches'));const pg=el('div','grid');results.projects.forEach((p)=>pg.appendChild(projectCard(p)));if(!results.projects.length)pg.appendChild(el('div','empty','No Project matches.'));ps.appendChild(pg);app.appendChild(ps);const items=el('section','section');items.appendChild(sectionHead('Work items',results.items.length+' matches'));const ig=el('div','grid');results.items.forEach((hit)=>ig.appendChild(cardForItem(projectOf(hit.projectRef),hit.item)));if(!results.items.length)ig.appendChild(el('div','empty','No work-item matches.'));items.appendChild(ig);app.appendChild(items)}
function render(){if(!workspace)return;const q=search.value.trim();if(q){renderSearch(q);return}const route=currentRoute();if(route.level==='ITEM')renderItem(route);else if(route.level==='PROJECT')renderProject(route);else renderProjects();status.classList.remove('error');status.textContent='Current public checkpoint loaded from VexWork. This page cannot mutate Workgraph truth.'}
search.addEventListener('input',render);window.addEventListener('popstate',()=>{search.value='';render()});
fetch(WORKSPACE_URL,{cache:'no-store'}).then((response)=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}).then((data)=>{workspace=Reader.validateWorkspace(data);render()}).catch((error)=>{status.classList.add('error');status.textContent='VexWork workspace is unavailable right now: '+error.message+'. Canonical work source remains available in this repository.'});
</script>
</body>
</html>
