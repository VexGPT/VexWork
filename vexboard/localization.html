<meta name="description" content="Cross-Product Localization Workspace over Product-owned VexBoard Localization Inventories.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--paper:#f4f6f9;--sheet:#fff;--ink:#18213a;--muted:#5d677b;--faint:#8a93a6;--rule:#d8dde6;--rule-strong:#b9c1cf;--focus:#2f5bea;--good:#15803d;--warn:#b45309;--bad:#be123c;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}a{color:var(--focus)}button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}code,.mono{font-family:var(--mono)}
.bar{display:flex;align-items:center;gap:12px;padding:10px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10}.bar .brand{font-weight:600;font-size:15px;color:var(--ink);text-decoration:none}.bar a.nav{color:var(--muted);text-decoration:none;font-size:13px}.bar a.nav:hover{color:var(--ink);text-decoration:underline}.bar .here{font-weight:600}.bar .spacer{flex:1}
.page{max-width:1380px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-right,0px)) 64px max(18px,env(safe-area-inset-left,0px))}.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}.intro h1{margin:0;font-size:28px;letter-spacing:-.02em}.intro p{margin:6px 0 0;max-width:78ch;color:var(--muted)}.truth{font:11px var(--mono);color:var(--faint);text-align:right}.truth strong{color:var(--ink)}
.summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-top:20px}.metric{padding:14px 16px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}.metric b{display:block;font-size:22px;letter-spacing:-.02em}.metric span{color:var(--muted);font-size:12px}
.sources{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 0}.source-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);font-size:12px}.source-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}.source-chip.off .dot{background:transparent;border:1px solid var(--faint)}.source-chip code{font-size:10.5px;color:var(--muted)}
.workspace{margin-top:22px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}.controls{display:grid;grid-template-columns:minmax(240px,1fr) 220px 180px;gap:8px;padding:12px;border-bottom:1px solid var(--rule);background:#fbfcfd}.controls input,.controls select{height:36px;border:1px solid var(--rule);border-radius:8px;background:#fff;padding:0 10px}.controls input:focus,.controls select:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--rule);background:#fff}.tab{flex:none;padding:10px 13px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:12.5px}.tab:hover{color:var(--ink)}.tab.on{color:var(--focus);border-bottom-color:var(--focus);font-weight:600}.tab .count{margin-left:5px;color:var(--faint);font:10px var(--mono)}
.pivot-note{padding:10px 14px;border-bottom:1px solid var(--rule);color:var(--muted);font-size:12.5px;background:#fcfcfd}.match-note{margin-left:8px;color:var(--faint)}.table-wrap{overflow:auto;max-height:min(68vh,820px)}table{width:100%;border-collapse:collapse;min-width:900px}th{position:sticky;top:0;z-index:2;text-align:left;background:#f8fafc;color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.055em;font-weight:600;border-bottom:1px solid var(--rule)}th,td{padding:9px 11px;vertical-align:top}td{border-bottom:1px solid #eceff4;font-size:12.5px}tbody tr:hover{background:#fafbff}td code{font-size:11px;overflow-wrap:anywhere}.value{max-width:360px;white-space:normal}.sub{display:block;color:var(--faint);font-size:11px;margin-top:2px}.pill{display:inline-flex;align-items:center;min-height:21px;padding:1px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:10.5px;font-weight:600;white-space:nowrap}.pill.good{background:#ecfdf5;color:#166534}.pill.warn{background:#fff7ed;color:#9a3412}.pill.bad{background:#fff1f2;color:#9f1239}.pill.muted{background:#f3f4f6;color:#6b7280}.open{display:inline-flex;align-items:center;height:27px;padding:0 9px;border:1px solid var(--rule);border-radius:7px;color:var(--ink);text-decoration:none;white-space:nowrap;background:#fff}.open:hover{border-color:var(--rule-strong)}.empty{padding:42px 18px;text-align:center;color:var(--muted)}.error{margin-top:14px;padding:10px 12px;background:#fff1f2;border:1px solid #fecdd3;border-radius:9px;color:#9f1239;font-size:12.5px}
footer{margin-top:22px;color:var(--faint);font-size:12px;max-width:90ch}
@media(max-width:820px){.intro{grid-template-columns:1fr}.truth{text-align:left}.summary{grid-template-columns:repeat(2,minmax(120px,1fr))}.controls{grid-template-columns:1fr}.page{padding-top:20px}}@media(max-width:480px){.summary{grid-template-columns:1fr 1fr}.bar{gap:9px}.bar .nav{font-size:12px}}
</style>

<body>
<header class="bar"><a class="brand" href="./projects.html">VexBoard</a><a class="nav" href="./projects.html">Projects</a><span class="here">Localization</span><span class="spacer"></span><a class="nav" href="../">VexWork</a></header>
<main class="page" id="app"><div class="intro"><div><h1>Localization</h1><p>Loading Product-owned localization inventories…</p></div></div></main>
<script>
window.addEventListener('error',(event)=>{const app=document.getElementById('app');if(!app)return;app.innerHTML='<div class="intro"><div><h1>Localization could not load.</h1><p></p></div></div>';app.querySelector('p').textContent=event?.message||'A module failed to load.'});
window.addEventListener('unhandledrejection',(event)=>{const app=document.getElementById('app');if(!app)return;app.innerHTML='<div class="intro"><div><h1>Localization could not load.</h1><p></p></div></div>';app.querySelector('p').textContent=String(event?.reason?.message||event?.reason||'Loading failed.')});
</script>
<script type="module">
import * as Catalog from '../src/shared/vexboard-lens-catalog.mjs';
import * as Inventory from '../src/shared/vexboard-localization-inventory.mjs';
import * as Workspace from '../src/shared/vexboard-localization-workspace.mjs';
import * as Changes from '../src/shared/vexboard-localization-change-set.mjs';

const CATALOG_URL = '../projects/vexboard/lens/catalog.json';
const INVENTORY_DIR = '../projects/localization-architecture/inventory/';
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);

function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
async function fetchJson(url) {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw Object.assign(new Error(`${url} HTTP ${response.status}`), { status: response.status });
  return response.json();
}
const short = (sha) => String(sha ?? '').slice(0, 7);
const count = (value) => Number(value ?? 0).toLocaleString();

function inventoryUrl(subject) {
  return `${INVENTORY_DIR}${subject.slug}.main.localization.json`;
}

async function loadSubjectInventory(subject) {
  const build = Catalog.buildFor(subject, 'main');
  if (!build) return { subject, build: null, inventory: null, state: 'NO_MAIN_BUILD', error: null };
  try {
    const raw = await fetchJson(inventoryUrl(subject));
    const inventory = Inventory.normalizeLocalizationInventory(raw);
    if (inventory.subjectRef !== subject.subjectRef) throw new Error(`Localization subject mismatch for ${subject.slug}`);
    if (inventory.buildRef !== 'main') throw new Error(`Localization build mismatch for ${subject.slug}`);
    if (inventory.sourceSnapshot.repositoryRef !== subject.repositoryRef) throw new Error(`Localization repository mismatch for ${subject.slug}`);
    if (inventory.sourceSnapshot.commit !== build.commit) throw new Error(`Localization revision mismatch for ${subject.slug}: inventory ${short(inventory.sourceSnapshot.commit)} vs catalog ${short(build.commit)}`);
    return { subject, build, inventory, state: 'CONNECTED', error: null };
  } catch (error) {
    return { subject, build, inventory: null, state: error?.status === 404 ? 'NOT_CONNECTED' : 'ERROR', error };
  }
}

function localeName(localeRef) {
  try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(localeRef) ?? localeRef; }
  catch { return localeRef; }
}
function subjectLabel(subjectRef) { return state.subjectByRef.get(subjectRef)?.label ?? subjectRef; }
function subjectFor(subjectRef) { return state.subjectByRef.get(subjectRef) ?? null; }
function pivotCount(pivot) { return Workspace.localizationWorkspaceRows(state.projection, pivot).length; }
function stateClass(value) {
  if (['SOURCE','OBSERVED_COMPLETE','SATISFIED','ALREADY_SHARED','LIKELY_SHARED'].includes(value)) return 'good';
  if (['OBSERVED_PARTIAL','NEEDS_REVIEW','OPEN','OPEN_TRANSLATION'].includes(value)) return 'warn';
  if (['DIVERGED','SOURCE_REMOVED','KEEP_SEPARATE'].includes(value)) return 'bad';
  return 'muted';
}
function pill(value) { return h('span', { class: `pill ${stateClass(value)}` }, String(value).replaceAll('_', ' ')); }
function codeValue(value) { return value ? h('code', {}, value) : h('span', { class: 'sub' }, '—'); }

const pivotNotes = Object.freeze({
  ELEMENTS: 'Occurrence-first view: which stable Product elements consume which source strings and roles.',
  STRINGS: 'Source-string view across Products. Source IDs remain independent even when values match.',
  VALUES: 'Value-first regrouping. Equal source-language values are evidence for review, never semantic identity by themselves.',
  GROUPS: 'A4 convergence candidates plus source identities already reused in more than one occurrence.',
  LOCALES: 'Observed locale identities plus explicit work targets. A work target is not Product support until source observes it.',
  COVERAGE: 'Product × locale observation. NOT OBSERVED is explicit; requested work stays visible without inventing fallback or Product support.',
  CHANGE_SETS: 'Existing browser-local A3 intent reconciled against current connected Product inventories. This page creates no second Change Set store.',
});

const searchPlaceholders = Object.freeze({
  ELEMENTS: 'Find element, screen, role, source string, or visible value',
  STRINGS: 'Find source string ID, visible value, source path, or format signature',
  VALUES: 'Find source value, convergence state, or evidence',
  GROUPS: 'Find group, source value, disposition, or evidence',
  LOCALES: 'Find locale code, e.g. es, ja, or zh-Hant',
  COVERAGE: 'Find locale, coverage state, role, or revision',
  CHANGE_SETS: 'Find Change Set, source string, locale, state, current value, or expected value',
});

const initialPivot = String(params.get('pivot') ?? 'STRINGS').toUpperCase();
const state = {
  catalog: null,
  projection: null,
  subjectByRef: new Map(),
  connected: [],
  unavailable: [],
  storageError: null,
  pivot: Workspace.LOCALIZATION_WORKSPACE_PIVOTS.includes(initialPivot) ? initialPivot : 'STRINGS',
  query: params.get('string') ?? params.get('q') ?? '',
  subjectRef: null,
  localeRef: params.get('locale') || null,
};

function syncUrl() {
  const next = new URL(location.href);
  next.search = '';
  if (state.pivot !== 'STRINGS') next.searchParams.set('pivot', state.pivot.toLowerCase());
  if (state.subjectRef) next.searchParams.set('subject', subjectFor(state.subjectRef)?.slug ?? state.subjectRef);
  if (state.localeRef) next.searchParams.set('locale', state.localeRef);
  if (state.query) next.searchParams.set('q', state.query);
  history.replaceState(null, '', next);
}

function lensHref(row) {
  const subject = subjectFor(row.subjectRef ?? row.subjectRefs?.[0]);
  if (!subject) return null;
  const sourceStringRef = row.sourceStringRef ?? row.sourceStringRefs?.[0] ?? null;
  const occurrence = row.firstOccurrenceOrNull ?? (row.elementRef ? row : null);
  const target = new URL('./lens.html', location.href);
  target.searchParams.set('subject', subject.slug);
  target.searchParams.set('build', 'main');
  target.searchParams.set('localization', '1');
  if (state.localeRef) target.searchParams.set('locale', state.localeRef);
  if (sourceStringRef) target.searchParams.set('string', sourceStringRef);
  if (occurrence?.elementRef) target.searchParams.set('element', occurrence.elementRef);
  if (occurrence?.screenRef) target.searchParams.set('screen', occurrence.screenRef);
  return `${target.pathname}${target.search}`;
}
function lensLink(row, label = 'Open in Lens') {
  const href = lensHref(row);
  return href ? h('a', { class: 'open', href }, label) : h('span', { class: 'sub' }, 'No Lens occurrence');
}

function table(headers, rows) {
  if (!rows.length) return h('div', { class: 'empty' }, 'No rows match this view.');
  return h('div', { class: 'table-wrap' }, h('table', {},
    h('thead', {}, h('tr', {}, headers.map((header) => h('th', {}, header)))),
    h('tbody', {}, rows)));
}
function tr(...cells) { return h('tr', {}, cells.map((cell) => h('td', {}, cell))); }
function subjectCell(ref, revision = null) { return [h('b', {}, subjectLabel(ref)), revision ? h('span', { class: 'sub mono' }, short(revision)) : null]; }

function renderElements(rows) {
  return table(['Product','Element','Role','String','Source value',''], rows.map((row) => tr(
    subjectCell(row.subjectRef, row.revision),
    codeValue(row.elementRef),
    pill(row.textRole ?? row.bindingRole),
    [codeValue(row.sourceStringRef), row.screenRef ? h('span', { class: 'sub' }, row.screenRef) : null],
    h('span', { class: 'value' }, row.sourceValue),
    lensLink(row),
  )));
}
function renderStrings(rows) {
  return table(['Product','Source string','Source value','Where used','Locales',''], rows.map((row) => tr(
    subjectCell(row.subjectRef, row.revision),
    [codeValue(row.sourceStringRef), h('span', { class: 'sub' }, row.sourcePath)],
    [h('span', { class: 'value' }, row.sourceValue), row.formatSignature ? h('span', { class: 'sub mono' }, row.formatSignature) : null],
    [h('b', {}, count(row.occurrenceRefs.length)), ' occurrence', row.occurrenceRefs.length === 1 ? '' : 's', row.mapped ? null : h('span', { class: 'sub' }, 'Not mapped by current Screen Lens')],
    row.localeRefs.join(', '),
    lensLink(row),
  )));
}
function renderValues(rows) {
  return table(['Source value','Strings','Products','Convergence','Evidence'], rows.map((row) => tr(
    h('span', { class: 'value' }, row.normalizedSourceValue),
    count(row.memberCount),
    row.subjectRefs.map(subjectLabel).join(', '),
    row.suggestedDispositionOrNull ? pill(row.suggestedDispositionOrNull) : h('span', { class: 'sub' }, 'Unique current value'),
    row.evidence.length ? row.evidence.join(' · ') : '—',
  )));
}
function renderGroups(rows) {
  return table(['Group','Source value','Members','Products','Disposition','Evidence'], rows.map((row) => tr(
    [codeValue(row.groupRef), h('span', { class: 'sub' }, row.groupType.replaceAll('_', ' '))],
    h('span', { class: 'value' }, row.normalizedSourceValue),
    count(row.memberCount),
    row.subjectRefs.map(subjectLabel).join(', '),
    pill(row.disposition),
    row.evidence.join(' · '),
  )));
}
function renderLocales(rows) {
  return table(['Locale','Observed Products','Complete Products','Observed strings','Missing','Requests'], rows.map((row) => tr(
    [
      h('b', {}, localeName(row.localeRef)),
      h('span', { class: 'sub mono' }, row.localeRef),
      row.observedSubjectCount === 0 ? h('span', { class: 'sub' }, 'Work target · not observed in Product source') : null,
    ],
    `${row.observedSubjectCount} / ${row.subjectCount}`,
    `${row.completeSubjectCount} / ${row.subjectCount}`,
    `${count(row.observedStringCount)} / ${count(row.sourceStringCount)}`,
    count(row.missingStringCount),
    count(row.requestedChangeCount),
  )));
}
function renderCoverage(rows) {
  return table(['Product','Locale','Status','Observed','Missing','Requests','Revision'], rows.map((row) => tr(
    h('b', {}, subjectLabel(row.subjectRef)),
    [h('b', {}, localeName(row.localeRef)), h('span', { class: 'sub mono' }, row.localeRef)],
    pill(row.completeness),
    `${count(row.observedStringCount)} / ${count(row.sourceStringCount)}`,
    count(row.missingStringCount),
    count(row.requestedChangeCount),
    codeValue(short(row.revision)),
  )));
}
function renderChangeSets(rows) {
  return table(['Product','Locale','Source string','State','Current','Expected','Working set'], rows.map((row) => {
    const source = state.projection.strings.find((candidate) => candidate.subjectRef === row.subjectRef && candidate.sourceStringRef === row.sourceStringRef) ?? row;
    return tr(
      subjectCell(row.subjectRef, row.currentRevisionOrNull ?? row.observedRevision),
      [h('b', {}, localeName(row.localeRef)), h('span', { class: 'sub mono' }, row.localeRef)],
      [codeValue(row.sourceStringRef), lensLink(source, 'Inspect')],
      pill(row.state),
      row.currentValueOrNull === null ? h('span', { class: 'sub' }, 'Missing') : h('span', { class: 'value' }, row.currentValueOrNull),
      h('span', { class: 'value' }, row.expectedValue),
      codeValue(row.changeSetRef),
    );
  }));
}
const renderers = { ELEMENTS: renderElements, STRINGS: renderStrings, VALUES: renderValues, GROUPS: renderGroups, LOCALES: renderLocales, COVERAGE: renderCoverage, CHANGE_SETS: renderChangeSets };

function filteredRows() {
  return Workspace.filterLocalizationWorkspaceRows(state.projection, state.pivot, {
    query: state.query,
    subjectRef: state.subjectRef,
    localeRef: state.localeRef,
    limit: 750,
  });
}
function matchSummary(rows) {
  if (!String(state.query ?? '').trim() && !state.subjectRef && !state.localeRef) return '';
  if (rows.length === 750) return 'Showing 750 matches (view limit).';
  return `${count(rows.length)} ${rows.length === 1 ? 'match' : 'matches'} in this view.`;
}

function render() {
  const summary = state.projection.summary;
  const rows = filteredRows();
  const subjectSelect = h('select', { 'aria-label': 'Product filter' },
    h('option', { value: '', selected: !state.subjectRef }, 'All connected Products'),
    state.connected.map(({ subject }) => h('option', { value: subject.subjectRef, selected: state.subjectRef === subject.subjectRef }, subject.label)));
  subjectSelect.addEventListener('change', () => { state.subjectRef = subjectSelect.value || null; syncUrl(); render(); });
  const localeSelect = h('select', { 'aria-label': 'Locale filter' },
    h('option', { value: '', selected: !state.localeRef }, 'All locale views'),
    state.projection.locales.map((row) => {
      const status = row.observedSubjectCount === 0
        ? ' · work target'
        : row.completeSubjectCount === row.subjectCount
          ? ' · complete'
          : '';
      return h('option', { value: row.localeRef, selected: state.localeRef === row.localeRef }, `${localeName(row.localeRef)} (${row.localeRef})${status}`);
    }));
  localeSelect.addEventListener('change', () => { state.localeRef = localeSelect.value || null; syncUrl(); render(); });
  const search = h('input', { type: 'search', value: state.query, placeholder: searchPlaceholders[state.pivot], title: searchPlaceholders[state.pivot], 'aria-label': 'Search Localization Workspace' });
  search.addEventListener('input', () => { state.query = search.value; syncUrl(); renderRows(); });

  app.replaceChildren(
    h('div', { class: 'intro' },
      h('div', {}, h('h1', {}, 'Localization'), h('p', {}, 'Cross-Product projection over current Main Localization Inventories. Products keep source ownership; this workspace changes the pivot, not the truth.')),
      h('div', { class: 'truth' }, 'current source · ', h('strong', {}, `${summary.inventoryCount} connected inventories`))),
    h('div', { class: 'summary' },
      metric(summary.subjectCount, 'connected Products'),
      metric(summary.sourceStringCount, 'source strings'),
      metric(summary.occurrenceCount, 'element occurrences'),
      metric(summary.localeCount, 'locale views'),
      metric(summary.activeChangeCount, 'active requested changes')),
    h('div', { class: 'sources' },
      state.connected.map(({ subject, inventory }) => h('span', { class: 'source-chip' }, h('span', { class: 'dot' }), subject.label, h('code', {}, short(inventory.sourceSnapshot.commit)))),
      state.unavailable.map(({ subject, state: availability }) => h('span', { class: 'source-chip off', title: availability === 'ERROR' ? 'Inventory failed to load' : 'No Main localization sidecar is connected' }, h('span', { class: 'dot' }), subject.label, h('span', { class: 'sub' }, availability.replaceAll('_', ' '))))),
    state.storageError ? h('div', { class: 'error' }, `Browser-local Change Sets could not be read safely: ${state.storageError.message}`) : null,
    state.unavailable.some((row) => row.state === 'ERROR') ? h('div', { class: 'error' }, 'One or more Product inventories failed validation. They are excluded rather than projected with uncertain identity.') : null,
    h('section', { class: 'workspace' },
      h('div', { class: 'controls' }, search, subjectSelect, localeSelect),
      h('div', { class: 'tabs' }, Workspace.LOCALIZATION_WORKSPACE_PIVOTS.map((pivot) => {
        const button = h('button', { class: `tab${state.pivot === pivot ? ' on' : ''}`, type: 'button' }, pivot.replace('_', ' '), h('span', { class: 'count', title: 'Total rows before filters' }, count(pivotCount(pivot))));
        button.onclick = () => { state.pivot = pivot; syncUrl(); render(); };
        return button;
      })),
      h('div', { class: 'pivot-note' }, h('span', {}, pivotNotes[state.pivot]), h('span', { id: 'match-summary', class: 'match-note' }, matchSummary(rows))),
      h('div', { id: 'rows' }, renderers[state.pivot](rows))),
    h('footer', {}, 'Observed Product strings remain immutable here. Requested future values live in the existing browser-local Localization Change Set layer and reconcile against current source; equal values remain evidence, not semantic identity.'));
}
function metric(value, label) { return h('div', { class: 'metric' }, h('b', {}, count(value)), h('span', {}, label)); }
function renderRows() {
  const rows = filteredRows();
  const host = document.getElementById('rows');
  if (host) host.replaceChildren(renderers[state.pivot](rows));
  const summary = document.getElementById('match-summary');
  if (summary) summary.textContent = matchSummary(rows);
}

async function boot() {
  state.catalog = Catalog.normalizeLensCatalog(await fetchJson(CATALOG_URL));
  state.subjectByRef = new Map(state.catalog.subjects.map((subject) => [subject.subjectRef, subject]));
  const requestedSubject = params.get('subject');
  if (requestedSubject) {
    const subject = state.catalog.subjects.find((candidate) => candidate.slug === requestedSubject || candidate.subjectRef === requestedSubject);
    state.subjectRef = subject?.subjectRef ?? null;
  }
  const results = await Promise.all(state.catalog.subjects.map(loadSubjectInventory));
  state.connected = results.filter((row) => row.state === 'CONNECTED');
  state.unavailable = results.filter((row) => row.state !== 'CONNECTED');
  if (!state.connected.length) throw new Error('No current Main Localization Inventories are connected.');

  let changeSetCollection;
  try { changeSetCollection = Changes.loadLocalizationChangeSetCollection(localStorage); }
  catch (error) { state.storageError = error; changeSetCollection = Changes.createLocalizationChangeSetCollection(); }
