<script type="module">
import * as Board from '../vexboard-reader.js';
import * as SourceResolver from '../src/shared/vexboard-source-resolver.mjs';

const app=document.getElementById('app');
let current=null,selected=null,tool='SELECT',connectFrom=null;
let camera=Board.normalizeCamera({x:48,y:48,zoom:1});
let collapsed=new Set();
let journey=null,journeyPathwayAnalysis=null;
let prototype=null,scenario=null,interactionTrail=[];
let boardStack=[];
let activeBoardRef=null;
let viewportEl=null,canvasEl=null,minimapEl=null,zoomReadoutEl=null;
let draftDirty=false,saveMessage='',suppressCanvasClick=false;
let pinnedSemanticRefs=new Set(),relationalFocusMode='CONNECT',pinMenuEl=null,relationshipViewMode='ALL';
let scrollOffsetsByProjectionRef=new Map();
let androidProjectionSources=new Map(),activeAndroidViewportProfileRef=null;
let sourceCatalogCache=null;
let drawerMode=null;
const THEME_MODE_WORKSPACE_BOARD_REF='board.vexlife.debug-menu.theme-mode.origin-walk';
const sourceCatalogUrls=Object.freeze([
  '../projects/vexboard/examples/board-source-catalog.json',
]);
const reducedMotion=globalThis.matchMedia?.('(prefers-reduced-motion: reduce)')||null;
const cameraAnimator=createCameraAnimator({
  normalizeCamera:Board.normalizeCamera,
  readCamera:()=>camera,
  writeCamera:(next)=>{camera=next;applyCamera()},
  requestFrame:(callback)=>requestAnimationFrame(callback),
  cancelFrame:(frameId)=>cancelAnimationFrame(frameId),
  now:()=>performance.now(),
  prefersReducedMotion:()=>Boolean(reducedMotion?.matches),
});

const el=(tag,cls='',text='')=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=='')n.textContent=String(text);return n};
const ref=(prefix)=>`${prefix}.${crypto.randomUUID().replaceAll('-','')}`;
const editable=()=>current?.mode==='LOCAL_DRAFT';
const drafts=()=>{try{return Board.parseDraftCollection(localStorage.getItem(Board.VEXBOARD_DRAFT_STORAGE_KEY))}catch{return[]}};
const store=(items)=>localStorage.setItem(Board.VEXBOARD_DRAFT_STORAGE_KEY,JSON.stringify(items));
const readPaletteMode=()=>{try{return Presentation.normalizePaletteMode(localStorage.getItem(Presentation.VEXBOARD_PALETTE_STORAGE_KEY))}catch{return'STANDARD'}};
let paletteMode=readPaletteMode();
const savedClock=(value)=>{if(!value)return'';try{return new Date(value).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch{return''}};
const designAuthorityLabel=(value)=>value==='VEXBOARD_DESIGN_AUTHORITY'?'VexBoard design authority':value==='VEXBOARD_DESIGN_DRAFT'?'VexBoard design draft':'Reverse-adopted design';
const THEME_MODE_FEATURE_WORKSPACE=Object.freeze({
  title:'Debug Menu / Theme Mode',
  project:'VexSync DebugMenu Blueprints',
  projectRef:'project.vexsync.debugmenu-blueprints',
  work:'ThemeMode Origin Walk',
  workRef:'work.vexsync.debugmenu-blueprints.feature-intention-builder-discovery',
  pullRef:'github.pull.vexwork.178',
  intent:'Discover a human-readable construction-grade Origin that maps through VexBoard to target code without inventing target mechanics.',
  frontier:Object.freeze([
    'persistence / repository ownership',
    'later-result / observation relationship',
    'lifecycle and convergence pressure',
  ]),
  vexWorkHref:'../?project=project.vexsync.debugmenu-blueprints&work=work.vexsync.debugmenu-blueprints.feature-intention-builder-discovery',
  library:Object.freeze([
    Object.freeze({name:'ThemeMode',status:'ESTABLISHED',detail:'Working Origin meaning · Light | Dark'}),
    Object.freeze({name:'control.debug-menu.theme-mode',status:'ESTABLISHED',detail:'Working Control identity for the Debug Menu Switch'}),
    Object.freeze({name:'ThemeModeToggle',status:'CANDIDATE',detail:'Current readable Control / Act relationship language'}),
    Object.freeze({name:'Theme persistence owner',status:'UNRESOLVED',detail:'Repository / source identity has not yet been earned'}),
    Object.freeze({name:'ThemeMode ConvergenceRelay',status:'UNRESOLVED',detail:'Not established; use only if independent complete truths earn convergence'}),
  ]),
});
function featureWorkspaceContext(){
  return activeBoardRef===THEME_MODE_WORKSPACE_BOARD_REF?THEME_MODE_FEATURE_WORKSPACE:null;
}

function markDraftDirty(){if(!editable())return;draftDirty=true;saveMessage='Unsaved changes'}
const node=(r)=>current.graph.nodes.find(n=>n.nodeRef===r);
const item=(r)=>current.projection.items.find(i=>i.projectionItemRef===r);
const itemFor=(r)=>current.projection.items.find(i=>i.semanticRef===r);
const viewportSize=()=>({width:Math.max(1,viewportEl?.clientWidth||1),height:Math.max(1,viewportEl?.clientHeight||1)});

async function loadBuiltIn(boardRef){
  const url=Board.builtinBoardUrl(boardRef);
  if(!url)throw new Error(`unknown built-in board ${boardRef}`);
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error(`${boardRef} HTTP ${response.status}`);
  return Board.normalizeDraft(await response.json());
}
async function loadBuiltInPrototype(boardRef){
  const url=Board.builtinPrototypeUrl(boardRef);
  if(!url)return null;
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error(`${boardRef} prototype HTTP ${response.status}`);

function designMetricRefsForSemantic(design,semanticRef){
  const refs=new Set();

    for(const axis of [constraint.horizontal,constraint.vertical]){
      for(const margin of [axis?.startMargin,axis?.endMargin])if(margin?.metricRef)refs.add(margin.metricRef);

  if(axis.size?.fraction!==undefined)parts.push(`${(axis.size.fraction*100).toFixed(1)}%`);
  if(axis.size?.referenceDp!==undefined)parts.push(`${axis.size.referenceDp}dp`);
  parts.push(`bias ${Number(axis.bias??0).toFixed(2)}`);
  if(axis.startMargin)parts.push(axis.startMargin.metricRef?`start @${axis.startMargin.metricRef}`:`start ${designMetricText(axis.startMargin)}`);

function toolButton(label,name,disabled=false){const b=el('button',`tool${tool===name?' active':''}`,label);b.disabled=disabled;b.onclick=()=>{tool=name;connectFrom=null;renderWorkspace();requestAnimationFrame(()=>applyCamera())};return b}

  view.onpointerdown=(e)=>{
    cameraAnimator.cancel();
    const targetPlane=Interaction.interactionPlaneForTarget(e.target);
    if(!Interaction.shouldStartCanvasPan({tool,targetPlane,button:e.button}))return;
    e.preventDefault();
    const start={x:e.clientX,y:e.clientY},origin=camera;let dragged=false;
    view.setPointerCapture(e.pointerId);
    view.onpointermove=m=>{const currentPoint={x:m.clientX,y:m.clientY};if(!dragged&&!Interaction.dragExceededThreshold(start,currentPoint))return;dragged=true;camera=Board.normalizeCamera(Interaction.cameraFromPointerDrag(origin,start,currentPoint));applyCamera()};
    const end=()=>{view.onpointermove=null;view.onpointerup=null;view.onpointercancel=null;if(dragged)suppressCanvasClick=true};
    view.onpointerup=end;view.onpointercancel=end;

  canvas.onclick=async e=>{if(suppressCanvasClick){suppressCanvasClick=false;return}if(editable()&&['RECTANGLE','DIAMOND','FRAME','TEXT'].includes(tool)){const point=Board.boardPointFromClient({clientX:e.clientX,clientY:e.clientY},view.getBoundingClientRect(),camera);await addShape(tool,point.x,point.y)}else if(tool!=='PAN'){selected=null;renderWorkspace();requestAnimationFrame(()=>applyCamera())}};
}

function androidSourceBoardRef(){
  return current?.mode==='LOCAL_DRAFT'?(current.derivedFromRefOrNull||null):(activeBoardRef||null);
}
async function reprojectAndroidDesign(nextDesign,{profileRef=activeAndroidViewportProfileRef,markDirty=false}={}){
  const sourceBoardRef=androidSourceBoardRef();
  if(!sourceBoardRef)return false;
  const source=await loadAndroidProjectionSourceContext(sourceBoardRef);
  if(!source)return false;
  const projected=AndroidProjector.projectVexLifeAndroidPocSnapshot(
    source.snapshot,
    sourceBoardRef,
    nextDesign,
    profileRef,
  ).board;
  const d=Board.normalizeDraft(projected),s=await Board.hydrateBoardState(d.graph,d.projection);
  const priorSelected=selected;
  const evidence=d.evidence?Evidence.normalizeBoardEvidence(d.evidence,s.graph):null;
  const design=ScreenDesign.normalizeScreenDesign(nextDesign);
  current={
    ...current,
    graph:s.graph,
    projection:s.projection,
    presentation:d.presentation,
    design,
    sourceRefs:d.sourceRefs,
    evidence,
    savedAtOrNull:markDirty?null:current.savedAtOrNull,
  };
  selected=priorSelected&&s.projection.items.some(item=>item.projectionItemRef===priorSelected)?priorSelected:null;
  activeAndroidViewportProfileRef=profileRef??design.referenceViewport.profileRef;
  scrollOffsetsByProjectionRef=new Map();

}
async function setAndroidViewportProfile(profileRef){

}
function designStyleRefs(design){
  const refs=new Set();
  for(const assignment of design.componentAssignments||[]){
    if(assignment.styleRef)refs.add(assignment.styleRef);
    if(assignment.selectedStyleRefOrNull)refs.add(assignment.selectedStyleRefOrNull);
  }
  return [...refs].sort();
}
async function editLocalComponentAssignment(semanticRef,field,value){
  if(!editable()||!current.design)return;
  const next=structuredClone(current.design);
  const assignment=next.componentAssignments?.find(entry=>entry.semanticRef===semanticRef);if(!assignment)return;
  assignment[field]=value||null;
  next.authorityState='VEXBOARD_DESIGN_DRAFT';
  try{
    const accepted=ScreenDesign.normalizeScreenDesign(next);
    await reprojectAndroidDesign(accepted,{markDirty:true});
  }catch(error){
    saveMessage=`Design edit rejected · ${error?.message||error}`;
    renderWorkspace();requestAnimationFrame(()=>applyCamera());
  }
}

async function editLocalDesignMetric(metricRef,field,value){
  if(!editable()||!current.design)return;

  const next=structuredClone(current.design);
  const metric=next.metrics?.[metricRef];if(!metric)return;
  metric[field]=value;
  next.authorityState='VEXBOARD_DESIGN_DRAFT';

    saveMessage=`Design edit rejected · ${error?.message||error}`;

}
