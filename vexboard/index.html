<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VexBoard — Semantic Canvas</title>
<meta name="description" content="Create local VexBoard drafts or inspect an existing semantic board through a zoomable, recursive, read-only canvas projection without mutating source truth.">
<style>
:root{--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--blue:#2563eb;--violet:#7c3aed;--paper:#fff;--wash:#fafaf9}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--wash);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input{font:inherit}.top{height:58px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#fff}.top strong{font:700 24px Georgia,serif}.top a{margin-left:auto;color:var(--blue);text-decoration:none}.app{height:calc(100% - 58px)}.landing{width:min(980px,calc(100% - 32px));margin:auto;padding:52px 0}.eyebrow,.tiny{font:700 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1{font:700 clamp(38px,7vw,70px)/1 Georgia,serif;letter-spacing:-.04em;margin:10px 0 18px}.lede{max-width:720px;color:var(--muted);line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d6d3d1;border-radius:8px;background:#fff;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.violet{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}.btn:disabled{opacity:.4;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px}.card h3{margin:5px 0}.card p{color:var(--muted);font-size:12px;line-height:1.5}.workspace{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center}.title{flex:1;border:1px solid transparent;border-radius:6px;padding:7px;font-weight:700}.title:not(:disabled):focus{outline:none;border-color:#93c5fd}.badge{font:700 8px ui-monospace,monospace;text-transform:uppercase;border-radius:999px;padding:5px 8px}.draft{background:#eff6ff;color:#1d4ed8}.readonly{background:#fff7ed;color:#c2410c}.zoom-readout{min-width:52px;text-align:center;color:var(--muted);font:700 10px ui-monospace,monospace}.work{min-height:0;display:grid;grid-template-columns:74px minmax(0,1fr) 286px}.tools{background:#fff;border-right:1px solid var(--line);padding:7px;display:flex;flex-direction:column;gap:5px}.tool{border:1px solid transparent;background:transparent;border-radius:7px;min-height:46px;font-size:9px;color:var(--muted);cursor:pointer}.tool.active{background:#eff6ff;border-color:#bfdbfe;color:var(--blue);font-weight:700}.tool:disabled{opacity:.35}.viewport{position:relative;overflow:hidden;background-color:#f7f7f5;background-image:radial-gradient(#d6d3d1 1px,transparent 1px);background-size:20px 20px;touch-action:none}.canvas{position:absolute;left:0;top:0;width:2100px;height:1100px;transform-origin:0 0;will-change:transform}.edges{position:absolute;inset:0;pointer-events:none}.edge{stroke:#94a3b8;stroke-width:2}.shape{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 3px 12px #00000010;user-select:none;touch-action:none;overflow:hidden}.shape.selected{outline:3px solid #2563eb33;border-color:var(--blue)}.shape.DIAMOND{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0;padding:18px}.shape.FRAME{border:2px dashed #94a3b8;background:#ffffff55;align-items:flex-start;justify-content:flex-start;color:#64748b}.shape.TEXT{border-color:transparent;background:transparent;box-shadow:none;justify-content:flex-start}.minimap{position:absolute;right:12px;bottom:12px;width:188px;height:118px;border:1px solid #cbd5e1;border-radius:9px;background:#ffffffef;box-shadow:0 5px 18px #0002;overflow:hidden;z-index:40}.minimap-item{position:absolute;background:#cbd5e1;border:1px solid #94a3b8;min-width:2px;min-height:2px}.minimap-view{position:absolute;border:2px solid var(--blue);background:#2563eb12;pointer-events:none}.inspector{background:#fff;border-left:1px solid var(--line);padding:14px;overflow:auto}.inspector h2{margin:0 0 5px;font:700 20px Georgia,serif}.sub{font-size:11px;color:var(--muted);margin-bottom:14px}.group{border-top:1px solid var(--line);padding:12px 0}.group h3{margin:0 0 8px;font:700 9px ui-monospace,monospace;text-transform:uppercase}.kv{display:grid;grid-template-columns:82px minmax(0,1fr);gap:6px;font-size:11px}.k{font:700 8px ui-monospace,monospace;color:#a8a29e;text-transform:uppercase}.v{overflow-wrap:anywhere;white-space:pre-wrap}.number{width:76px}.journey-stack{display:flex;flex-direction:column;gap:5px;margin:8px 0}.journey-step{border:1px solid var(--line);border-radius:7px;background:#fafaf9;padding:6px 8px;text-align:left;font-size:10px;cursor:pointer}.journey-step.current{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8;font-weight:700}.journey-choice{width:100%;text-align:left}.shape.simulatable{cursor:pointer;box-shadow:0 0 0 2px #7c3aed22,0 3px 12px #00000010}.prototype-overlays{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:45;pointer-events:none}.prototype-overlay{max-width:280px;border:1px solid #c4b5fd;border-radius:8px;background:#f5f3ffea;color:#5b21b6;padding:8px 10px;box-shadow:0 5px 18px #0002;font-size:11px}.empty{color:var(--muted);line-height:1.6;font-size:12px}@media(max-width:850px){.work{grid-template-columns:62px minmax(0,1fr)}.inspector{display:none}.minimap{width:150px;height:94px}}
</style>
</head>
<body>
<header class="top"><strong>VexBoard</strong><span class="tiny">semantic canvas proving ground</span><a href="../">← VexWork</a></header>
<main id="app" class="app"></main>
<script type="module">
import * as Board from '../vexboard-reader.js';
import { createCameraAnimator } from './ui/camera-animation.mjs';

const app=document.getElementById('app');
let current=null,selected=null,tool='SELECT',connectFrom=null;
let camera=Board.normalizeCamera({x:48,y:48,zoom:1});
let collapsed=new Set();
let journey=null;
let prototype=null,scenario=null,interactionTrail=[];
let boardStack=[];
let activeBoardRef=null;
let viewportEl=null,canvasEl=null,minimapEl=null,zoomReadoutEl=null;
const reducedMotion=globalThis.matchMedia?.('(prefers-reduced-motion: reduce)')||null;
const cameraAnimator=createCameraAnimator({
  normalizeCamera:Board.normalizeCamera,
  readCamera:()=>camera,
  writeCamera:(next)=>{camera=next;applyCamera()},
  requestFrame:(callback)=>requestAnimationFrame(callback),
  cancelFrame:(frameId)=>cancelAnimationFrame(frameId),
  now:()=>performance.now(),
  prefersReducedMotion:()=>Boolean(reducedMotion?.matches),
});

const el=(tag,cls='',text='')=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=='')n.textContent=String(text);return n};
const ref=(prefix)=>`${prefix}.${crypto.randomUUID().replaceAll('-','')}`;
const editable=()=>current?.mode==='LOCAL_DRAFT';
const drafts=()=>{try{return Board.parseDraftCollection(localStorage.getItem(Board.VEXBOARD_DRAFT_STORAGE_KEY))}catch{return[]}};
const store=(items)=>localStorage.setItem(Board.VEXBOARD_DRAFT_STORAGE_KEY,JSON.stringify(items));
const node=(r)=>current.graph.nodes.find(n=>n.nodeRef===r);
const item=(r)=>current.projection.items.find(i=>i.projectionItemRef===r);
const itemFor=(r)=>current.projection.items.find(i=>i.semanticRef===r);
const viewportSize=()=>({width:Math.max(1,viewportEl?.clientWidth||1),height:Math.max(1,viewportEl?.clientHeight||1)});

async function loadBuiltIn(boardRef){
  const url=Board.builtinBoardUrl(boardRef);
  if(!url)throw new Error(`unknown built-in board ${boardRef}`);
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error(`${boardRef} HTTP ${response.status}`);
  return Board.normalizeDraft(await response.json());
}
async function loadBuiltInPrototype(boardRef){
  const url=Board.builtinPrototypeUrl(boardRef);
  if(!url)return null;
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error(`${boardRef} prototype HTTP ${response.status}`);
  return response.json();
}
async function selfMap(){return loadBuiltIn('board.vexboard.self-map')}
async function openBuiltInBoard(boardRef,{pushCurrent=false}={}){
  const d=await loadBuiltIn(boardRef),prototypeInput=await loadBuiltInPrototype(boardRef);
  return openBoard(d,{pushCurrent,boardRef,prototypeInput});
}

function snapshotCurrent(){return current?{current,selected,tool,camera,collapsed:[...collapsed],journey,prototype,scenario,interactionTrail:interactionTrail.map(entry=>({...entry})),activeBoardRef}:null}
async function openBoard(input,{pushCurrent=false,boardRef=null,prototypeInput=null}={}){
  cameraAnimator.cancel();
  if(pushCurrent&&current)boardStack.push(snapshotCurrent());
  const d=Board.normalizeDraft(input),s=await Board.hydrateBoardState(d.graph,d.projection);
  current={...d,graph:s.graph,projection:s.projection};selected=null;tool='SELECT';connectFrom=null;
  prototype=prototypeInput?Board.normalizeBoardPrototype(prototypeInput,s.graph):null;
  scenario=prototype?Board.createBoardScenario(prototype,s.graph,{scenarioRef:ref('scenario.vexboard')}):null;
  interactionTrail=[];collapsed=new Set();journey=null;camera=Board.normalizeCamera({x:48,y:48,zoom:1});activeBoardRef=boardRef||d.draftRef;
  renderWorkspace();requestAnimationFrame(()=>fitBoard());
}
function returnBoard(){cameraAnimator.cancel();const prior=boardStack.pop();if(!prior)return;({current,selected,tool,camera,journey,prototype,scenario,interactionTrail,activeBoardRef}=prior);collapsed=new Set(prior.collapsed);connectFrom=null;renderWorkspace();requestAnimationFrame(()=>applyCamera())}
async function enterPortal(detailBoardRef){
  const local=drafts().find(d=>d.draftRef===detailBoardRef);
  if(local){await openBoard(local,{pushCurrent:true,boardRef:detailBoardRef});return}
  const url=Board.builtinBoardUrl(detailBoardRef);
  if(!url)throw new Error(`portal target unavailable ${detailBoardRef}`);
  await openBuiltInBoard(detailBoardRef,{pushCurrent:true});
}

function landing(){
  cameraAnimator.cancel();
  current=null;selected=null;journey=null;prototype=null;scenario=null;interactionTrail=[];boardStack=[];activeBoardRef=null;app.className='app';app.replaceChildren();
  const box=el('section','landing');
  box.append(el('div','eyebrow','VexBoard canvas projection'),el('h1','','Design the map before implementation has to guess it.'),el('p','lede','Create a local semantic-board draft or inspect an existing source board through a zoomable, pannable, recursive canvas. Camera, focus and collapse are read-only view state; requesting edit still forks a browser-local draft copy rather than mutating source truth.'));
  const actions=el('div','row');
  const create=el('button','btn primary','Create new');create.onclick=async()=>openBoard(await Board.createBlankDraft({draftRef:ref('draft.vexboard')}));
  const open=el('button','btn violet','Open VexBoard self-map');open.onclick=async()=>openBuiltInBoard('board.vexboard.self-map');
  const simulate=el('button','btn violet','Open prototype demo');simulate.onclick=async()=>openBuiltInBoard('board.vexboard.prototype-demo');
  actions.append(create,open,simulate);box.append(actions,el('h2','','Local drafts'));
  const list=el('div','cards');
  for(const d of drafts()){const c=el('article','card');c.append(el('div','tiny',d.mode),el('h3','',d.title),el('p','',d.derivedFromRefOrNull?`Forked from ${d.derivedFromRefOrNull}`:'Independent local draft'));const b=el('button','btn','Resume draft');b.onclick=()=>openBoard(d,{boardRef:d.draftRef});c.append(b);list.append(c)}
  if(!drafts().length){const c=el('article','card');c.append(el('div','tiny','No drafts yet'),el('h3','','Start with Create new'),el('p','','Browser-local proving copies · not source truth.'));list.append(c)}
  box.append(list);app.append(box);
}

async function act(name,args){
  const control=Board.controlFor(current,{controlRef:ref('control.vexboard'),actorRef:'actor.vexboard.human',act:name,arguments:args});
  const r=await Board.applyBoardControl({graph:current.graph,projection:current.projection,control});
  current={...current,graph:r.graph,projection:r.projection};renderWorkspace();requestAnimationFrame(()=>applyCamera());
}
async function addShape(kind,x,y){
  const semantic=kind==='DIAMOND'?'DECISION':kind==='FRAME'?'CONTAINER':kind==='TEXT'?'ANNOTATION':'PROCESS',nref=ref('node.vexboard'),iref=ref('item.vexboard'),count=current.graph.nodes.length+1;
  await act('CREATE_NODE',{node:{nodeRef:nref,kind:semantic,label:`${semantic[0]}${semantic.slice(1).toLowerCase()} ${count}`,parentRefOrNull:null,detailBoardRefOrNull:null,sourceRefs:[]},projectionItem:{projectionItemRef:iref,semanticRef:nref,shapeKind:kind,bounds:{x,y,width:kind==='FRAME'?360:180,height:kind==='FRAME'?220:82},layer:kind==='FRAME'?-1:0,parentProjectionItemRefOrNull:null,visible:true,locked:false}});
  selected=iref;tool='SELECT';renderWorkspace();requestAnimationFrame(()=>applyCamera());
}

function visibleItems(){return Board.visibleProjectionItems(current.graph,current.projection,[...collapsed])}
function applyCamera(){
  if(canvasEl)canvasEl.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.zoom})`;
  if(zoomReadoutEl)zoomReadoutEl.textContent=`${Math.round(camera.zoom*100)}%`;
  renderMinimap();
}
function fitBoard(){if(!current||!viewportEl)return;cameraAnimator.jumpTo(Board.cameraForBounds(Board.projectionBounds(visibleItems()),viewportSize(),{padding:72,maxZoom:1.35}))}
function resetView(){cameraAnimator.jumpTo(Board.normalizeCamera({x:48,y:48,zoom:1}))}
function focusSelected({animate=false}={}){const target=selected?item(selected):null;if(!target||!viewportEl)return;const targetCamera=Board.cameraForBounds(target.bounds,viewportSize(),{padding:120,maxZoom:1.7});animate?cameraAnimator.animateTo(targetCamera):cameraAnimator.jumpTo(targetCamera)}
function zoomBy(factor,anchor=null){if(!viewportEl)return;const size=viewportSize(),point=anchor||{anchorX:size.width/2,anchorY:size.height/2};cameraAnimator.jumpTo(Board.zoomCameraAt(camera,{factor,...point}))}

function renderEdges(svg,visibleSemanticRefs){
  for(const r of current.graph.relationships){
    if(!visibleSemanticRefs.has(r.fromRef)||!visibleSemanticRefs.has(r.toRef))continue;
    const a=itemFor(r.fromRef),b=itemFor(r.toRef);if(!a||!b)continue;
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.classList.add('edge');
    l.setAttribute('x1',a.bounds.x+a.bounds.width/2);l.setAttribute('y1',a.bounds.y+a.bounds.height/2);l.setAttribute('x2',b.bounds.x+b.bounds.width/2);l.setAttribute('y2',b.bounds.y+b.bounds.height/2);svg.append(l);
  }
}
function prototypeChoices(controlRef,trigger='CLICK'){
  if(!prototype||!scenario)return[];
  return Board.boardInteractionChoices(current.graph,prototype,scenario,{controlRef,trigger});
}
function applySimulationInteraction(interactionRef){
  const fromRef=journey.currentRef,result=Board.applyBoardInteraction({graph:current.graph,journey,prototype,scenario,interactionRef});
  const interaction=prototype.interactions.find(candidate=>candidate.interactionRef===result.interactionRef);
  if(!interaction)throw new Error(`prototype interaction unavailable ${result.interactionRef}`);
  interactionTrail=[...interactionTrail,{
    sequence:interactionTrail.length,
    interactionRef:result.interactionRef,
    controlRef:interaction.controlRef,
    trigger:result.trigger,
    conditionRefOrNull:interaction.conditionOrNull?.conditionRef??null,
    conditionState:result.conditionState,
    fromRef,
    toRef:result.journey.currentRef,
  }];
  journey=result.journey;scenario=result.scenario;
  const focusRef=result.focusRefOrNull||journey.currentRef,target=itemFor(focusRef);
  if(target)selected=target.projectionItemRef;
  renderWorkspace();requestAnimationFrame(()=>focusSelected({animate:true}));
}
function interactionTrailText(){
  if(!interactionTrail.length)return'No interactions yet.';
  return interactionTrail.map(entry=>{
    const control=node(entry.controlRef),condition=entry.conditionRefOrNull?`${entry.conditionRefOrNull} = ${entry.conditionState}`:`unconditional = ${entry.conditionState}`;
    return `${entry.sequence+1}. ${control?.label||entry.controlRef} · ${entry.trigger} · ${condition} · ${entry.fromRef} → ${entry.toRef}`;
  }).join('\n');
}
function tryClickableControl(nodeRef){
  if(!prototype||!scenario||!journey||journey.currentRef!==nodeRef)return false;
  const choices=prototypeChoices(nodeRef,'CLICK'),ready=choices.filter(choice=>choice.conditionState==='TRUE');
  if(choices.length!==1||ready.length!==1)return false;
  applySimulationInteraction(ready[0].interactionRef);return true;
}
function renderPrototypeOverlays(view){
  if(!prototype||!scenario?.openOverlayRefs.length)return;
  const layer=el('div','prototype-overlays');
  for(const overlayRef of scenario.openOverlayRefs){
    const overlay=prototype.overlays.find(candidate=>candidate.overlayRef===overlayRef);
    layer.append(el('div','prototype-overlay',overlay?.label||overlayRef));
  }
  view.append(layer);
}

function renderCanvas(canvas){
  const shown=visibleItems(),visibleSemanticRefs=new Set(shown.map(i=>i.semanticRef));
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('edges');svg.setAttribute('width','2100');svg.setAttribute('height','1100');renderEdges(svg,visibleSemanticRefs);canvas.append(svg);
  for(const i of [...shown].sort((a,b)=>a.layer-b.layer)){
    const n=node(i.semanticRef);if(!n)continue;
    const canSimulate=n.kind==='CONTROL'&&prototype&&journey?.currentRef===n.nodeRef;
    const s=el('div',`shape ${i.shapeKind}${selected===i.projectionItemRef?' selected':''}${canSimulate?' simulatable':''}`,n.label);Object.assign(s.style,{left:`${i.bounds.x}px`,top:`${i.bounds.y}px`,width:`${i.bounds.width}px`,height:`${i.bounds.height}px`,zIndex:String(i.layer+10)});
    s.onclick=async(e)=>{e.stopPropagation();if(tool==='CONNECT'&&editable()){if(!connectFrom){connectFrom=i.projectionItemRef;selected=i.projectionItemRef;renderWorkspace();requestAnimationFrame(()=>applyCamera());return}const from=item(connectFrom);connectFrom=null;if(from&&from.semanticRef!==i.semanticRef)await act('CONNECT_NODES',{relationship:{relationshipRef:ref('rel.vexboard'),kind:'FLOW',fromRef:from.semanticRef,toRef:i.semanticRef,labelOrNull:null,sourceRefs:[]}});tool='SELECT';selected=i.projectionItemRef;renderWorkspace();requestAnimationFrame(()=>applyCamera());return}if(tool==='SELECT'&&tryClickableControl(n.nodeRef))return;selected=i.projectionItemRef;renderWorkspace();requestAnimationFrame(()=>applyCamera())};
    if(editable()&&tool==='SELECT'&&!i.locked)s.onpointerdown=(e)=>{cameraAnimator.cancel();e.preventDefault();e.stopPropagation();const sx=e.clientX,sy=e.clientY,ox=i.bounds.x,oy=i.bounds.y,zoom=camera.zoom;s.setPointerCapture(e.pointerId);s.onpointermove=m=>{s.style.left=`${ox+(m.clientX-sx)/zoom}px`;s.style.top=`${oy+(m.clientY-sy)/zoom}px`};s.onpointerup=async u=>{s.onpointermove=null;s.onpointerup=null;await act('MOVE_ITEM',{projectionItemRef:i.projectionItemRef,x:ox+(u.clientX-sx)/zoom,y:oy+(u.clientY-sy)/zoom})}};
    canvas.append(s);
  }
}

function renderMinimap(){
  if(!minimapEl||!current||!viewportEl)return;
  minimapEl.replaceChildren();
  const width=2100,height=1100,miniW=minimapEl.clientWidth||188,miniH=minimapEl.clientHeight||118;
  for(const i of visibleItems()){
    const m=el('div','minimap-item');Object.assign(m.style,{left:`${i.bounds.x/width*miniW}px`,top:`${i.bounds.y/height*miniH}px`,width:`${Math.max(2,i.bounds.width/width*miniW)}px`,height:`${Math.max(2,i.bounds.height/height*miniH)}px`});minimapEl.append(m);
  }
  const v=Board.boardViewport(camera,viewportSize()),frame=el('div','minimap-view');
  Object.assign(frame.style,{left:`${v.x/width*miniW}px`,top:`${v.y/height*miniH}px`,width:`${v.width/width*miniW}px`,height:`${v.height/height*miniH}px`});minimapEl.append(frame);
}

function journeyBoardRef(){return activeBoardRef||current?.draftRef||null}
function applyJourney(next){journey=next;const target=itemFor(journey.currentRef);if(target)selected=target.projectionItemRef;renderWorkspace();requestAnimationFrame(()=>focusSelected({animate:true}))}
function startJourneyAt(semanticRef){interactionTrail=[];applyJourney(Board.createBoardJourney(current.graph,{journeyRef:ref('journey.vexboard'),boardRef:journeyBoardRef(),startRef:semanticRef}))}
function followJourney(relationshipRef){applyJourney(Board.advanceBoardJourney(current.graph,journey,relationshipRef))}
function backJourney(){applyJourney(Board.backBoardJourney(current.graph,journey))}
function revisitJourney(sequence){applyJourney(Board.revisitBoardJourney(current.graph,journey,sequence))}

function inspector(side){
  side.replaceChildren();const i=selected?item(selected):null,n=i?node(i.semanticRef):null;
  if(!i||!n){side.append(el('h2','','Context Inspector'),el('p','empty','Select a semantic object to inspect its stable identity, projection geometry, source refs, relationship neighborhood, and bounded model-facing query.'));return}
  side.append(el('h2','',n.label),el('div','sub',`${n.kind} · ${i.shapeKind}`));
  const g=el('div','group');g.append(el('h3','','Identity + design'));const kv=el('div','kv');[['nodeRef',n.nodeRef],['projection',i.projectionItemRef],['position',`${Math.round(i.bounds.x)}, ${Math.round(i.bounds.y)}`],['layer',i.layer],['board',activeBoardRef||current.draftRef]].forEach(([k,v])=>kv.append(el('div','k',k),el('div','v',v)));g.append(kv);
  const nav=el('div','row');const focus=el('button','btn','Focus selected');focus.onclick=()=>focusSelected({animate:true});nav.append(focus);
  const children=current.graph.nodes.filter(candidate=>candidate.parentRefOrNull===n.nodeRef);
  if(children.length){const toggle=el('button','btn',collapsed.has(n.nodeRef)?'Expand children':'Collapse children');toggle.onclick=()=>{collapsed.has(n.nodeRef)?collapsed.delete(n.nodeRef):collapsed.add(n.nodeRef);renderWorkspace();requestAnimationFrame(()=>applyCamera())};nav.append(toggle)}
  if(n.detailBoardRefOrNull){const enter=el('button','btn violet','Enter portal');enter.disabled=!Board.builtinBoardUrl(n.detailBoardRefOrNull)&&!drafts().some(d=>d.draftRef===n.detailBoardRefOrNull);enter.onclick=()=>enterPortal(n.detailBoardRefOrNull);nav.append(enter)}
  g.append(nav);
  if(editable()){const row=el('div','row');for(const [label,key,val] of [['Width','width',i.bounds.width],['Height','height',i.bounds.height]]){const lab=el('label','k',label);const input=document.createElement('input');input.className='number';input.type='number';input.min='20';input.value=Math.round(val);input.onchange=()=>act('RESIZE_ITEM',{projectionItemRef:i.projectionItemRef,width:key==='width'?Number(input.value):i.bounds.width,height:key==='height'?Number(input.value):i.bounds.height});lab.append(input);row.append(lab)}const front=el('button','btn','Forward');front.onclick=()=>act('SET_LAYER',{projectionItemRef:i.projectionItemRef,layer:i.layer+1});row.append(front);g.append(row)}
  side.append(g);
  const rel=current.graph.relationships.filter(r=>r.fromRef===n.nodeRef||r.toRef===n.nodeRef),rg=el('div','group');rg.append(el('h3','','Relationships'),el('div','v',rel.length?rel.map(r=>`${r.fromRef} → ${r.toRef}`).join('\n'):'No relationships yet.'));side.append(rg);
  const q=Board.queryBoardNeighborhood(current,{semanticRef:n.nodeRef,depth:1,maxNodes:12}),qg=el('div','group');qg.append(el('h3','','Neighborhood · bounded query'),el('div','v',`${q.nodes.map(value=>value.nodeRef).join('\n')}\n\n${q.relationships.length} relationship(s) · depth ${q.depth}`));side.append(qg);
  if(prototype&&scenario){
    const pg=el('div','group');pg.append(el('h3','','Prototype simulation'));
    const values=scenario.values.length?scenario.values.map(entry=>`${entry.valueRef} = ${JSON.stringify(entry.value)}`).join('\n'):'No scenario values set.';
    const overlays=scenario.openOverlayRefs.length?scenario.openOverlayRefs.join('\n'):'No overlays open.';
    pg.append(el('div','v',`Scenario\n${values}\n\nOverlays\n${overlays}\n\nExternal effects: none`));
    if(n.kind==='CONTROL'){
      const active=journey&&journey.boardRef===journeyBoardRef()&&journey.currentRef===n.nodeRef;
      if(!active){const start=el('button','btn violet','Start simulation here');start.onclick=()=>startJourneyAt(n.nodeRef);pg.append(start)}
      else{
        const interactions=prototype.interactions.filter(interaction=>interaction.controlRef===n.nodeRef);
        for(const interaction of interactions){
          const choice=prototypeChoices(n.nodeRef,interaction.trigger).find(candidate=>candidate.interactionRef===interaction.interactionRef);
          const button=el('button','btn journey-choice',`${interaction.trigger} · ${choice?.conditionState||'UNKNOWN'}`);
          button.disabled=choice?.conditionState!=='TRUE';button.onclick=()=>applySimulationInteraction(interaction.interactionRef);pg.append(button);
        }
        if(!interactions.length)pg.append(el('div','empty','No prototype interactions for this control.'));
      }
    }
    side.append(pg);
  }
  const jg=el('div','group');jg.append(el('h3','','BoardJourney · semantic walk'));
  if(prototype)jg.append(el('div','v',`Interaction path\n${interactionTrailText()}`));
  const journeyActive=journey&&journey.boardRef===journeyBoardRef();
  if(!journeyActive){const start=el('button','btn violet','Start journey here');start.onclick=()=>startJourneyAt(n.nodeRef);jg.append(start)}else{
    const currentNode=node(journey.currentRef),summary=el('div','v',`Current: ${currentNode?.label||journey.currentRef}\n${journey.steps.length} step(s) · ${journey.returnStack.length} return point(s)`);jg.append(summary);
    const stack=el('div','journey-stack');for(const step of journey.steps){const stepNode=node(step.semanticRef),button=el('button',`journey-step${step.sequence===journey.steps.length-1?' current':''}`,`${step.sequence+1}. ${stepNode?.label||step.semanticRef} · ${step.navigationKind}`);button.disabled=step.sequence===journey.steps.length-1;button.onclick=()=>revisitJourney(step.sequence);stack.append(button)}jg.append(stack);
    const choices=Board.journeyChoices(current.graph,journey);for(const choice of choices){const target=node(choice.toRef),label=choice.labelOrNull||`${choice.kind} → ${target?.label||choice.toRef}`,button=el('button','btn journey-choice',label);button.onclick=()=>followJourney(choice.relationshipRef);jg.append(button)}
    if(journey.returnStack.length){const back=el('button','btn','Back');back.onclick=backJourney;jg.append(back)}
    if(!choices.length)jg.append(el('div','empty','No outgoing relationship from the current semantic coordinate.'));
  }
  side.append(jg);
  const sg=el('div','group');sg.append(el('h3','','Source refs'),el('div','v',n.sourceRefs.length?n.sourceRefs.join('\n'):'Local draft object · no source binding'));side.append(sg);
}

function toolButton(label,name,disabled=false){const b=el('button',`tool${tool===name?' active':''}`,label);b.disabled=disabled;b.onclick=()=>{tool=name;connectFrom=null;renderWorkspace();requestAnimationFrame(()=>applyCamera())};return b}
function wireViewport(view,canvas){
  view.onwheel=(e)=>{e.preventDefault();const rect=view.getBoundingClientRect();zoomBy(e.deltaY<0?1.12:1/1.12,{anchorX:e.clientX-rect.left,anchorY:e.clientY-rect.top})};
  view.onpointerdown=(e)=>{cameraAnimator.cancel();if(tool!=='PAN')return;e.preventDefault();const startX=e.clientX,startY=e.clientY,origin=camera;view.setPointerCapture(e.pointerId);view.onpointermove=m=>{camera=Board.normalizeCamera({x:origin.x+m.clientX-startX,y:origin.y+m.clientY-startY,zoom:origin.zoom});applyCamera()};view.onpointerup=()=>{view.onpointermove=null;view.onpointerup=null}};
  canvas.onclick=async e=>{if(editable()&&['RECTANGLE','DIAMOND','FRAME','TEXT'].includes(tool)){const point=Board.boardPointFromClient({clientX:e.clientX,clientY:e.clientY},view.getBoundingClientRect(),camera);await addShape(tool,point.x,point.y)}else if(tool!=='PAN'){selected=null;renderWorkspace();requestAnimationFrame(()=>applyCamera())}};
}

function renderWorkspace(){
  app.className='app workspace';app.replaceChildren();
  const bar=el('div','bar'),home=el('button','btn','← Boards');home.onclick=landing;bar.append(home);
  if(boardStack.length){const back=el('button','btn','↩ Return');back.onclick=returnBoard;bar.append(back)}
  const title=document.createElement('input');title.className='title';title.value=current.title;title.disabled=!editable();title.onchange=()=>{current={...current,title:title.value.trim()||'Untitled VexBoard'};renderWorkspace();requestAnimationFrame(()=>applyCamera())};
  const badge=el('span',`badge ${editable()?'draft':'readonly'}`,editable()?'Local draft · source detached':'Read-only source');bar.append(title,badge);
  const zoomOut=el('button','btn','Zoom out');zoomOut.onclick=()=>zoomBy(1/1.18);const zoomIn=el('button','btn','Zoom in');zoomIn.onclick=()=>zoomBy(1.18);const fit=el('button','btn','Fit');fit.onclick=fitBoard;const reset=el('button','btn','Reset view');reset.onclick=resetView;zoomReadoutEl=el('span','zoom-readout','100%');bar.append(zoomOut,zoomIn,fit,reset,zoomReadoutEl);
  if(editable()){const save=el('button','btn primary','Save draft');save.onclick=()=>{current={...current,savedAtOrNull:new Date().toISOString()};store(Board.upsertDraft(drafts(),current));renderWorkspace();requestAnimationFrame(()=>applyCamera())};bar.append(save)}else{const fork=el('button','btn violet','Request edit → draft copy');fork.onclick=async()=>openBoard(await Board.forkReadOnlyBoard(current,{draftRef:ref('draft.vexboard')}));bar.append(fork)}
  app.append(bar);
  const work=el('div','work'),tools=el('aside','tools'),disabled=!editable();tools.append(toolButton('Select','SELECT'),toolButton('Pan','PAN'),toolButton('Box','RECTANGLE',disabled),toolButton('Decision','DIAMOND',disabled),toolButton('Frame','FRAME',disabled),toolButton('Text','TEXT',disabled),toolButton('Connect','CONNECT',disabled));
  viewportEl=el('section','viewport');canvasEl=el('div','canvas');renderCanvas(canvasEl);viewportEl.append(canvasEl);minimapEl=el('div','minimap');minimapEl.setAttribute('aria-label','Canvas minimap');viewportEl.append(minimapEl);renderPrototypeOverlays(viewportEl);wireViewport(viewportEl,canvasEl);
  const side=el('aside','inspector');inspector(side);work.append(tools,viewportEl,side);app.append(work);applyCamera();
}

landing();
</script>
