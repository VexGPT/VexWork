<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VexBoard — Semantic Canvas</title>
<meta name="description" content="Create local VexBoard drafts or inspect an existing semantic board read-only without mutating source truth.">
<style>
:root{--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--blue:#2563eb;--violet:#7c3aed;--paper:#fff;--wash:#fafaf9}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--wash);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input{font:inherit}.top{height:58px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#fff}.top strong{font:700 24px Georgia,serif}.top a{margin-left:auto;color:var(--blue);text-decoration:none}.app{height:calc(100% - 58px)}.landing{width:min(980px,calc(100% - 32px));margin:auto;padding:52px 0}.eyebrow,.tiny{font:700 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1{font:700 clamp(38px,7vw,70px)/1 Georgia,serif;letter-spacing:-.04em;margin:10px 0 18px}.lede{max-width:720px;color:var(--muted);line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d6d3d1;border-radius:8px;background:#fff;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.violet{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}.btn:disabled{opacity:.4;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px}.card h3{margin:5px 0}.card p{color:var(--muted);font-size:12px;line-height:1.5}.workspace{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center}.title{flex:1;border:1px solid transparent;border-radius:6px;padding:7px;font-weight:700}.title:not(:disabled):focus{outline:none;border-color:#93c5fd}.badge{font:700 8px ui-monospace,monospace;text-transform:uppercase;border-radius:999px;padding:5px 8px}.draft{background:#eff6ff;color:#1d4ed8}.readonly{background:#fff7ed;color:#c2410c}.work{min-height:0;display:grid;grid-template-columns:74px minmax(0,1fr) 286px}.tools{background:#fff;border-right:1px solid var(--line);padding:7px;display:flex;flex-direction:column;gap:5px}.tool{border:1px solid transparent;background:transparent;border-radius:7px;min-height:46px;font-size:9px;color:var(--muted);cursor:pointer}.tool.active{background:#eff6ff;border-color:#bfdbfe;color:var(--blue);font-weight:700}.tool:disabled{opacity:.35}.viewport{overflow:auto;background-color:#f7f7f5;background-image:radial-gradient(#d6d3d1 1px,transparent 1px);background-size:20px 20px}.canvas{position:relative;min-width:2100px;min-height:1100px}.edges{position:absolute;inset:0;pointer-events:none}.edge{stroke:#94a3b8;stroke-width:2}.shape{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 3px 12px #00000010;user-select:none;touch-action:none;overflow:hidden}.shape.selected{outline:3px solid #2563eb33;border-color:var(--blue)}.shape.DIAMOND{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0;padding:18px}.shape.FRAME{border:2px dashed #94a3b8;background:#ffffff55;align-items:flex-start;justify-content:flex-start;color:#64748b}.shape.TEXT{border-color:transparent;background:transparent;box-shadow:none;justify-content:flex-start}.inspector{background:#fff;border-left:1px solid var(--line);padding:14px;overflow:auto}.inspector h2{margin:0 0 5px;font:700 20px Georgia,serif}.sub{font-size:11px;color:var(--muted);margin-bottom:14px}.group{border-top:1px solid var(--line);padding:12px 0}.group h3{margin:0 0 8px;font:700 9px ui-monospace,monospace;text-transform:uppercase}.kv{display:grid;grid-template-columns:82px minmax(0,1fr);gap:6px;font-size:11px}.k{font:700 8px ui-monospace,monospace;color:#a8a29e;text-transform:uppercase}.v{overflow-wrap:anywhere;white-space:pre-wrap}.number{width:76px}.empty{color:var(--muted);line-height:1.6;font-size:12px}@media(max-width:850px){.work{grid-template-columns:62px minmax(0,1fr)}.inspector{display:none}}
</style>
</head>
<body>
<header class="top"><strong>VexBoard</strong><span class="tiny">semantic canvas proving ground</span><a href="../">← VexWork</a></header>
<main id="app" class="app"></main>
<script type="module">
import * as Board from '../vexboard-reader.js';
const app=document.getElementById('app');let current=null,selected=null,tool='SELECT',connectFrom=null;
const el=(tag,cls='',text='')=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=='')n.textContent=String(text);return n};
const ref=(prefix)=>`${prefix}.${crypto.randomUUID().replaceAll('-','')}`;
const editable=()=>current?.mode==='LOCAL_DRAFT';
const drafts=()=>{try{return Board.parseDraftCollection(localStorage.getItem(Board.VEXBOARD_DRAFT_STORAGE_KEY))}catch{return[]}};
const store=(items)=>localStorage.setItem(Board.VEXBOARD_DRAFT_STORAGE_KEY,JSON.stringify(items));
const node=(r)=>current.graph.nodes.find(n=>n.nodeRef===r);const item=(r)=>current.projection.items.find(i=>i.projectionItemRef===r);const itemFor=(r)=>current.projection.items.find(i=>i.semanticRef===r);
async function selfMap(){const r=await fetch(Board.VEXBOARD_SELF_MAP_URL,{cache:'no-store'});if(!r.ok)throw new Error(`self-map HTTP ${r.status}`);return Board.normalizeDraft(await r.json())}
async function openBoard(input){const d=Board.normalizeDraft(input),s=await Board.hydrateBoardState(d.graph,d.projection);current={...d,graph:s.graph,projection:s.projection};selected=null;tool='SELECT';connectFrom=null;renderWorkspace()}
function landing(){current=null;app.className='app';app.replaceChildren();const box=el('section','landing');box.append(el('div','eyebrow','VexBoard foundation'),el('h1','','Design the map before implementation has to guess it.'),el('p','lede','Create a local semantic-board draft or inspect an existing source board read-only. Requesting edit currently forks a browser-local draft copy, so playing with the board cannot mutate VexWork or a target system.'));const actions=el('div','row');const create=el('button','btn primary','Create new');create.onclick=async()=>openBoard(await Board.createBlankDraft({draftRef:ref('draft.vexboard')}));const open=el('button','btn violet','Open VexBoard self-map');open.onclick=async()=>openBoard(await selfMap());actions.append(create,open);box.append(actions,el('h2','','Local drafts'));const list=el('div','cards');for(const d of drafts()){const c=el('article','card');c.append(el('div','tiny',d.mode),el('h3','',d.title),el('p','',d.derivedFromRefOrNull?`Forked from ${d.derivedFromRefOrNull}`:'Independent local draft'));const b=el('button','btn','Resume draft');b.onclick=()=>openBoard(d);c.append(b);list.append(c)}if(!drafts().length){const c=el('article','card');c.append(el('div','tiny','No drafts yet'),el('h3','','Start with Create new'),el('p','','Browser-local proving copies · not source truth.'));list.append(c)}box.append(list);app.append(box)}
async function act(name,args){const control=Board.controlFor(current,{controlRef:ref('control.vexboard'),actorRef:'actor.vexboard.human',act:name,arguments:args});const r=await Board.applyBoardControl({graph:current.graph,projection:current.projection,control});current={...current,graph:r.graph,projection:r.projection};renderWorkspace()}
async function addShape(kind,x,y){const semantic=kind==='DIAMOND'?'DECISION':kind==='FRAME'?'CONTAINER':kind==='TEXT'?'ANNOTATION':'PROCESS',nref=ref('node.vexboard'),iref=ref('item.vexboard'),count=current.graph.nodes.length+1;await act('CREATE_NODE',{node:{nodeRef:nref,kind:semantic,label:`${semantic[0]}${semantic.slice(1).toLowerCase()} ${count}`,parentRefOrNull:null,detailBoardRefOrNull:null,sourceRefs:[]},projectionItem:{projectionItemRef:iref,semanticRef:nref,shapeKind:kind,bounds:{x,y,width:kind==='FRAME'?360:180,height:kind==='FRAME'?220:82},layer:kind==='FRAME'?-1:0,parentProjectionItemRefOrNull:null,visible:true,locked:false}});selected=iref;tool='SELECT';renderWorkspace()}
function renderEdges(svg){for(const r of current.graph.relationships){const a=itemFor(r.fromRef),b=itemFor(r.toRef);if(!a||!b)continue;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.classList.add('edge');l.setAttribute('x1',a.bounds.x+a.bounds.width/2);l.setAttribute('y1',a.bounds.y+a.bounds.height/2);l.setAttribute('x2',b.bounds.x+b.bounds.width/2);l.setAttribute('y2',b.bounds.y+b.bounds.height/2);svg.append(l)}}
function renderCanvas(canvas){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('edges');svg.setAttribute('width','2100');svg.setAttribute('height','1100');renderEdges(svg);canvas.append(svg);for(const i of [...current.projection.items].sort((a,b)=>a.layer-b.layer)){const n=node(i.semanticRef);if(!n||!i.visible)continue;const s=el('div',`shape ${i.shapeKind}${selected===i.projectionItemRef?' selected':''}`,n.label);Object.assign(s.style,{left:`${i.bounds.x}px`,top:`${i.bounds.y}px`,width:`${i.bounds.width}px`,height:`${i.bounds.height}px`,zIndex:String(i.layer+10)});s.onclick=async(e)=>{e.stopPropagation();if(tool==='CONNECT'&&editable()){if(!connectFrom){connectFrom=i.projectionItemRef;selected=i.projectionItemRef;renderWorkspace();return}const from=item(connectFrom);connectFrom=null;if(from&&from.semanticRef!==i.semanticRef)await act('CONNECT_NODES',{relationship:{relationshipRef:ref('rel.vexboard'),kind:'FLOW',fromRef:from.semanticRef,toRef:i.semanticRef,labelOrNull:null,sourceRefs:[]}});tool='SELECT';selected=i.projectionItemRef;renderWorkspace();return}selected=i.projectionItemRef;renderWorkspace()};if(editable()&&tool==='SELECT'&&!i.locked)s.onpointerdown=(e)=>{e.preventDefault();const sx=e.clientX,sy=e.clientY,ox=i.bounds.x,oy=i.bounds.y;s.setPointerCapture(e.pointerId);s.onpointermove=m=>{s.style.left=`${ox+m.clientX-sx}px`;s.style.top=`${oy+m.clientY-sy}px`};s.onpointerup=async u=>{s.onpointermove=null;s.onpointerup=null;await act('MOVE_ITEM',{projectionItemRef:i.projectionItemRef,x:ox+u.clientX-sx,y:oy+u.clientY-sy})}};canvas.append(s)}}
function inspector(side){side.replaceChildren();const i=selected?item(selected):null,n=i?node(i.semanticRef):null;if(!i||!n){side.append(el('h2','','Context Inspector'),el('p','empty','Select a semantic object to inspect its stable identity, projection geometry, source refs, and relationship neighborhood.'));return}side.append(el('h2','',n.label),el('div','sub',`${n.kind} · ${i.shapeKind}`));const g=el('div','group');g.append(el('h3','','Identity + design'));const kv=el('div','kv');[['nodeRef',n.nodeRef],['projection',i.projectionItemRef],['position',`${Math.round(i.bounds.x)}, ${Math.round(i.bounds.y)}`],['layer',i.layer]].forEach(([k,v])=>kv.append(el('div','k',k),el('div','v',v)));g.append(kv);if(editable()){const row=el('div','row');for(const [label,key,val] of [['Width','width',i.bounds.width],['Height','height',i.bounds.height]]){const lab=el('label','k',label);const input=document.createElement('input');input.className='number';input.type='number';input.min='20';input.value=Math.round(val);input.onchange=()=>act('RESIZE_ITEM',{projectionItemRef:i.projectionItemRef,width:key==='width'?Number(input.value):i.bounds.width,height:key==='height'?Number(input.value):i.bounds.height});lab.append(input);row.append(lab)}const front=el('button','btn','Forward');front.onclick=()=>act('SET_LAYER',{projectionItemRef:i.projectionItemRef,layer:i.layer+1});row.append(front);g.append(row)}side.append(g);const rel=current.graph.relationships.filter(r=>r.fromRef===n.nodeRef||r.toRef===n.nodeRef);const rg=el('div','group');rg.append(el('h3','','Relationships'),el('div','v',rel.length?rel.map(r=>`${r.fromRef} → ${r.toRef}`).join('\n'):'No relationships yet.'));side.append(rg);const sg=el('div','group');sg.append(el('h3','','Source refs'),el('div','v',n.sourceRefs.length?n.sourceRefs.join('\n'):'Local draft object · no source binding'));side.append(sg)}
function toolButton(label,name,disabled=false){const b=el('button',`tool${tool===name?' active':''}`,label);b.disabled=disabled;b.onclick=()=>{tool=name;connectFrom=null;renderWorkspace()};return b}
function renderWorkspace(){app.className='app workspace';app.replaceChildren();const bar=el('div','bar'),home=el('button','btn','← Boards');home.onclick=landing;const title=document.createElement('input');title.className='title';title.value=current.title;title.disabled=!editable();title.onchange=()=>{current={...current,title:title.value.trim()||'Untitled VexBoard'};renderWorkspace()};const badge=el('span',`badge ${editable()?'draft':'readonly'}`,editable()?'Local draft · source detached':'Read-only source');bar.append(home,title,badge);if(editable()){const save=el('button','btn primary','Save draft');save.onclick=()=>{current={...current,savedAtOrNull:new Date().toISOString()};store(Board.upsertDraft(drafts(),current));renderWorkspace()};bar.append(save)}else{const fork=el('button','btn violet','Request edit → draft copy');fork.onclick=async()=>openBoard(await Board.forkReadOnlyBoard(current,{draftRef:ref('draft.vexboard')}));bar.append(fork)}app.append(bar);const work=el('div','work'),tools=el('aside','tools'),disabled=!editable();tools.append(toolButton('Select','SELECT'),toolButton('Box','RECTANGLE',disabled),toolButton('Decision','DIAMOND',disabled),toolButton('Frame','FRAME',disabled),toolButton('Text','TEXT',disabled),toolButton('Connect','CONNECT',disabled));const view=el('section','viewport'),canvas=el('div','canvas');canvas.onclick=async e=>{if(editable()&&['RECTANGLE','DIAMOND','FRAME','TEXT'].includes(tool)){const point=Board.localPointFromClient({clientX:e.clientX,clientY:e.clientY},canvas.getBoundingClientRect());await addShape(tool,point.x,point.y)}else{selected=null;renderWorkspace()}};renderCanvas(canvas);view.append(canvas);const side=el('aside','inspector');inspector(side);work.append(tools,view,side);app.append(work)}
landing();
</script>
</body>
</html>
