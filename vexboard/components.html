<style>

<header class="bar"><a class="brand" href="./projects.html">VexBoard</a><a class="nav" href="./projects.html">Projects</a><span class="here">Components</span><span class="spacer"></span><a class="nav" href="./localization.html">Localization</a><a class="nav" href="../">VexWork</a></header>
<main class="page" id="app"><div class="intro"><div><h1>Component Gallery</h1><p>Loading current component inventory…</p></div></div></main>
<script type="module">
import * as Catalog from '../src/shared/vexboard-lens-catalog.mjs';

const app=document.getElementById('app');
const CATALOG_URL='../projects/vexboard/lens/catalog.json';
const INVENTORY_DIR='../projects/component-library-architecture/inventory/';
const ARCHITECTURE_URL='../projects/component-library-architecture/component-architecture-catalog.json';
const params=new URLSearchParams(location.search);
const requestedView=params.get('view');
const PIVOT_KEYS=Object.freeze(['COMPONENTS','STATES','VARIANTS','PRODUCTS','REALIZATIONS','WHERE_USED','PROOF']);
const requestedPivot=String(params.get('pivot')??'').toUpperCase().replaceAll('-','_');
const initialPivot=requestedView==='realizations'?'REALIZATIONS':PIVOT_KEYS.includes(requestedPivot)?requestedPivot:'COMPONENTS';
const initialView=requestedView==='architecture'?'ARCHITECTURE':'SOURCE';
const state={catalog:null,subject:null,inventory:null,inventories:new Map(),sourceSubject:params.get('source')??'vexlife-android',architecture:null,pivot:initialPivot,view:initialView,query:params.get('q')??'',kind:params.get('kind')??'',surface:params.get('surface')??'',selected:params.get('component')??null,architectureClass:params.get('class')??'',selectedArchitecture:params.get('architecture')??null,realizationPlatform:params.get('platform')??'',selectedRealization:params.get('realization')??null,workspaceProduct:params.get('product')??''};

function h(tag,attrs={},...children){const node=document.createElement(tag);for(const [key,value] of Object.entries(attrs||{})){if(value===null||value===undefined||value===false)continue;if(key==='class')node.className=value;else if(key.startsWith('on'))node.addEventListener(key.slice(2),value);else if(key==='style')node.style.cssText=value;else node.setAttribute(key,value===true?'':String(value));}for(const child of children.flat(Infinity)){if(child===null||child===undefined||child===false)continue;node.append(child instanceof Node?child:document.createTextNode(String(child)));}return node;}
async function fetchJson(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(url+' HTTP '+response.status);return response.json();}
const short=(sha)=>String(sha??'').slice(0,7);
const count=(value)=>Number(value??0).toLocaleString();
const human=(value)=>String(value??'').toLowerCase().split(/[_-]/u).map((word)=>word?word[0].toUpperCase()+word.slice(1):word).join(' ');
function syncUrl(){
 const next=new URL(location.href);
 next.search='';
 if(state.pivot!=='COMPONENTS')next.searchParams.set('pivot',state.pivot.toLowerCase().replaceAll('_','-'));
 if(state.pivot==='COMPONENTS'&&state.view==='ARCHITECTURE')next.searchParams.set('view','architecture');
 if(state.query)next.searchParams.set('q',state.query);
 if(state.pivot==='COMPONENTS'){
  if(state.view==='SOURCE'){
   if(state.sourceSubject!=='vexlife-android')next.searchParams.set('source',state.sourceSubject);
   if(state.kind)next.searchParams.set('kind',state.kind);
   if(state.surface)next.searchParams.set('surface',state.surface);
   if(state.selected)next.searchParams.set('component',state.selected);
  }else if(state.view==='ARCHITECTURE'){
   if(state.architectureClass)next.searchParams.set('class',state.architectureClass);
   if(state.selectedArchitecture)next.searchParams.set('architecture',state.selectedArchitecture);
  }
 }else if(state.pivot==='REALIZATIONS'){
  if(state.realizationPlatform)next.searchParams.set('platform',state.realizationPlatform);
  if(state.selectedRealization)next.searchParams.set('realization',state.selectedRealization);
 }else if(['STATES','VARIANTS','WHERE_USED'].includes(state.pivot)&&state.workspaceProduct){
  next.searchParams.set('product',state.workspaceProduct);
 }
 history.replaceState(null,'',next);
}
function occurrenceRows(component){return Components.occurrencesForComponent(state.inventory,component.componentRef).filter((row)=>!state.surface||row.surfaceRef===state.surface);}
function visibleFamilies(){
 let rows=state.query?Components.searchComponentInventory(state.inventory,state.query,{limit:500}):state.inventory.components;
 if(state.kind)rows=rows.filter((row)=>row.kind===state.kind);
 if(state.surface)rows=rows.filter((row)=>row.surfaceRefs.includes(state.surface));
 return rows;
}
function lensHref(row){if(!row.screenRef)return null;return Catalog.lensHref(state.subject,{build:'main',screen:row.screenRef,element:row.elementRef});}
function familyCard(component){
 const rows=Components.occurrencesForComponent(state.inventory,component.componentRef);
 const localized=rows.filter((row)=>row.localization.sourceStringRefs.length).length;
 const button=h('button',{type:'button',class:'family'+(state.selected===component.componentRef?' on':'')},
  h('div',{class:'top'},h('h2',{},human(component.kind)),h('span',{class:'pill'},'OBSERVED')),
  h('div',{class:'counts'},h('span',{},h('b',{},count(rows.length)),' occurrences'),h('span',{},h('b',{},count(component.screenRefs.length)),' screens'),h('span',{},h('b',{},count(component.realizerSymbols.length)),' realizers'),h('span',{},h('b',{},count(localized)),' localized')),
  h('div',{class:'sub'},component.componentRef));
 button.onclick=()=>{state.selected=component.componentRef;syncUrl();render();requestAnimationFrame(()=>document.querySelector('.detail')?.scrollIntoView({block:'nearest'}));};
 return button;
}
function tableFor(component){
 const rows=occurrenceRows(component);
 if(!rows.length)return h('div',{class:'empty'},'No occurrences match the current surface filter.');
 return h('div',{class:'table-wrap'},h('table',{},
  h('thead',{},h('tr',{},['Where used','Element','Style / role','Localization','Realization','Source',''].map((label)=>h('th',{},label)))),
  h('tbody',{},rows.map((row)=>{
   const href=lensHref(row);
   return h('tr',{},
    h('td',{},h('b',{},row.surfaceLabel),h('span',{class:'sub mono'},row.surfaceRef)),
    h('td',{class:'value'},h('span',{},row.label),h('span',{class:'sub mono'},row.elementRef),row.childElementRefs.length?h('span',{class:'sub'},count(row.childElementRefs.length)+' direct children'):null),
    h('td',{},row.style?h('span',{class:'pill'},row.style):h('span',{class:'sub'},'default'),row.textRole?h('span',{class:'sub'},human(row.textRole)):null,row.intent?h('span',{class:'sub value'},row.intent):null),
    h('td',{},row.localization.sourceStringRefs.length?h('b',{},count(row.localization.sourceStringRefs)+' string '+(row.localization.sourceStringRefs.length===1?'binding':'bindings')):h('span',{class:'sub'},row.localization.state.replaceAll('_',' ').toLowerCase()),row.localization.resourceRef?h('span',{class:'sub mono'},row.localization.resourceRef):null),
    h('td',{},row.realization.realizedBy.length?row.realization.realizedBy.slice(0,3).map((value)=>h('span',{class:'sub mono'},value)):h('span',{class:'sub'},'No direct realizer projected'),row.realization.realizedBy.length>3?h('span',{class:'sub'},'+'+(row.realization.realizedBy.length-3)+' more'):null),
    h('td',{class:'value'},row.sourcePath?h('code',{},row.sourcePath):h('span',{class:'sub'},'Surface source not projected')),
    h('td',{},href?h('a',{class:'open',href},'Open in Lens'):h('span',{class:'sub'},'Chrome occurrence'))
   );
  }))
 ));
}
function detail(component){
 const rows=Components.occurrencesForComponent(state.inventory,component.componentRef);
 return h('section',{class:'detail'},
  h('div',{class:'detail-head'},
   h('div',{},h('h2',{},human(component.kind)),h('p',{},'Observed Product source family. This groups current Screen Lens element-kind occurrences for discovery and where-used; it is not yet an accepted cross-platform portable component.'),
    h('div',{class:'facts'},h('span',{class:'fact'},component.meaningState.replaceAll('_',' ').toLowerCase()),h('span',{class:'fact'},'portability: '+component.portability.toLowerCase()),h('span',{class:'fact'},count(rows.length)+' occurrences'),h('span',{class:'fact'},count(component.styles.length)+' styles'),h('span',{class:'fact'},count(component.localizationSourceStringRefs.length)+' source-string links'),h('span',{class:'fact'},'accessibility: '+component.accessibilityState.toLowerCase().replaceAll('_',' ')))),
   h('code',{class:'mono'},component.componentRef)),
  tableFor(component));
}
function viewTabs(){
 const source=h('button',{type:'button',class:'view-tab'+(state.view==='SOURCE'?' on':'')},'Source families');
 const architecture=h('button',{type:'button',class:'view-tab'+(state.view==='ARCHITECTURE'?' on':'')},'Architecture');
 source.onclick=()=>{state.pivot='COMPONENTS';state.view='SOURCE';state.query='';syncUrl();render();};
 architecture.onclick=()=>{state.pivot='COMPONENTS';state.view='ARCHITECTURE';state.query='';syncUrl();render();};
 return h('div',{class:'view-tabs','aria-label':'Component evidence layer'},source,architecture);
}
function visibleArchitecture(){
 let rows=state.query?Architecture.searchComponentArchitecture(state.architecture,state.query,{limit:500}):state.architecture.candidates;
 if(state.architectureClass)rows=rows.filter((row)=>row.class===state.architectureClass);
 return rows;
}
function architectureCard(candidate){
 const results=Architecture.targetPressuresForCandidate(state.architecture,candidate.candidateRef);
 const button=h('button',{type:'button',class:'family'+(state.selectedArchitecture===candidate.candidateRef?' on':'')},
  h('div',{class:'top'},h('h2',{},candidate.label),h('span',{class:'pill'},candidate.formation?'A3 '+candidate.formation.state.replaceAll('_',' '):candidate.state.replaceAll('_',' '))),
  h('div',{class:'counts'},h('span',{},h('b',{},candidate.class),' class'),h('span',{},h('b',{},count(candidate.sourceEvidence.length)),' source witnesses'),h('span',{},h('b',{},candidate.formation?human(candidate.formation.kind):'Evidence only'),' formation'),h('span',{},h('b',{},count(results.length)),' target results')),
  h('div',{class:'sub'},candidate.candidateRef));
 button.onclick=()=>{state.selectedArchitecture=candidate.candidateRef;syncUrl();render();requestAnimationFrame(()=>document.querySelector('.detail')?.scrollIntoView({block:'nearest'}));};
 return button;
}
function listBlock(title,rows){
 return h('div',{style:'padding:0 22px 18px'},h('b',{},title),rows.length?h('ul',{style:'margin:8px 0 0;padding-left:20px;color:var(--muted)'},rows.map((row)=>h('li',{},row))):h('span',{class:'sub'},'None declared.'));
}
function formationBlock(candidate){
 const formation=candidate.formation;
 if(!formation)return h('div',{style:'padding:0 22px 18px'},h('b',{},'A3 formation'),h('span',{class:'sub'},'Not in the bounded A3 formation set yet. Evidence remains available without forcing a portable contract.'));
 return h('div',{style:'padding:0 22px 18px'},
  h('div',{class:'top',style:'margin-bottom:10px'},h('b',{},'A3 formation'),h('span',{class:'pill'},formation.state)),
  h('div',{class:'facts'},h('span',{class:'fact'},human(formation.kind)),h('span',{class:'fact'},count(formation.sourceOwnerRefs.length)+' source owners')),
  h('p',{style:'color:var(--muted);margin:10px 0 14px'},formation.ownerRule),
  listBlock('Portable fields',formation.portableFields),
  listBlock('Explicit non-ownership',formation.nonOwnership),
  listBlock('Target obligations',formation.targetObligations),
  listBlock('Acceptance proof still required',formation.acceptanceProofs),
  formation.note?h('div',{class:'boundary',style:'margin-top:10px'},h('b',{},'Formation note: '),formation.note):null
 );
}
function targetPressureBlock(candidate){
 const results=Architecture.targetPressuresForCandidate(state.architecture,candidate.candidateRef);
 if(!results.length)return h('div',{style:'padding:0 22px 18px'},h('b',{},'Target pressure results'),h('span',{class:'sub'},'No target experiment is formed for this candidate yet.'));
 const rows=results.flatMap((pressure)=>pressure.relationships.map((relation)=>({pressure,relation})));
 return h('div',{style:'padding:0 0 18px'},
  h('div',{style:'padding:0 22px 10px'},h('b',{},'Target pressure results'),h('span',{class:'sub'},'Reference pressure is evidence, not portable acceptance or native proof.')),
  h('div',{class:'table-wrap'},h('table',{},
   h('thead',{},h('tr',{},['Target','Pressure state','Relationship','Disposition','Target mapping','Proof'].map((label)=>h('th',{},label)))),
   h('tbody',{},rows.map(({pressure,relation})=>{
    const passed=pressure.proofs.filter((proof)=>proof.state==='PASS').length;
    const owed=pressure.proofs.filter((proof)=>proof.state==='OWED').length;
    const held=pressure.proofs.filter((proof)=>proof.state==='HELD').length;

     h('td',{},h('span',{class:'pill'},pressure.state.replaceAll('_',' ')),h('span',{class:'sub mono'},pressure.pressureRef)),
     h('td',{class:'value'},h('code',{},relation.relationRef),h('span',{class:'sub'},relation.source)),
     h('td',{},h('span',{class:'pill'},relation.disposition.replaceAll('_',' '))),
     h('td',{class:'value'},relation.target),
     h('td',{},h('b',{},passed+' pass'),owed?h('span',{class:'sub'},owed+' owed'):null,held?h('span',{class:'sub'},held+' held'):null)
    );
   }))
  )),
  h('div',{style:'padding:10px 22px 0'},results.map((pressure)=>h('div',{class:'source-chip'},pressure.repositoryRef,' · ',h('code',{},pressure.path))))
 );
}
function architectureDetail(candidate){
 const results=Architecture.targetPressuresForCandidate(state.architecture,candidate.candidateRef);
 return h('section',{class:'detail'},
  h('div',{class:'detail-head'},
   h('div',{},h('h2',{},candidate.label),h('p',{},candidate.question),
    h('div',{class:'facts'},h('span',{class:'fact'},candidate.class.toLowerCase()),h('span',{class:'fact'},candidate.state.toLowerCase().replaceAll('_',' ')),h('span',{class:'fact'},count(candidate.sourceEvidence.length)+' witnesses'),h('span',{class:'fact'},count(results.length)+' target results'))),
   h('code',{class:'mono'},candidate.candidateRef)),
  listBlock('Observed candidate relationships',candidate.portableRelationships),
  listBlock('Observed obligations',candidate.obligations),
  listBlock('Candidate must not own',candidate.mustNotOwn),
  formationBlock(candidate),
  listBlock('Target pressure questions',candidate.targetPressure),
  targetPressureBlock(candidate),
  h('div',{class:'table-wrap'},h('table',{},
   h('thead',{},h('tr',{},['Repository','Source','Symbols','Why it matters'].map((label)=>h('th',{},label)))),
   h('tbody',{},candidate.sourceEvidence.map((row)=>h('tr',{},
    h('td',{},h('code',{},row.repositoryRef),h('span',{class:'sub mono'},short(row.commit))),
    h('td',{class:'value'},h('code',{},row.path)),
    h('td',{},row.symbols.map((symbol)=>h('span',{class:'sub mono'},symbol))),
    h('td',{class:'value'},row.why)
   )))
  )),
  candidate.note?h('div',{class:'boundary',style:'margin:18px 22px'},h('b',{},'Working note: '),candidate.note):null
 );
}
function candidateLabel(candidateRef){
 return state.architecture.candidates.find((row)=>row.candidateRef===candidateRef)?.label??candidateRef;
}
function visibleRealizations(){
 let rows=Architecture.targetRealizations(state.architecture);
 if(state.query){
  const needle=state.query.toLowerCase();
  rows=rows.filter((row)=>[
   row.realizationRef,row.candidateRef,candidateLabel(row.candidateRef),row.platformRef,row.framework,row.pressureState,
   row.repositoryRef,row.commit,row.path,
   ...row.relationships.flatMap((relation)=>[relation.relationRef,relation.disposition,relation.source,relation.target]),
   ...row.proofs.flatMap((proof)=>[proof.proofRef,proof.state,proof.note]),
   row.note
  ].filter(Boolean).join('\n').toLowerCase().includes(needle));
 }
 if(state.realizationPlatform)rows=rows.filter((row)=>row.platformRef===state.realizationPlatform);
 return rows;
}
function realizationCard(realization){
 const mapped=realization.relationCounts.MAPPED??0;
 const held=(realization.relationCounts.HELD??0)+(realization.relationCounts.UNSUPPORTED??0);
 const passed=realization.proofCounts.PASS??0;
