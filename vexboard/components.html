.specimen-wrap{padding:24px;min-height:360px;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#fff 0,#f5f7fb 58%,#eef1f6 100%)}.specimen-stage{width:min(620px,100%);min-height:230px;border:1px dashed #c6ceda;border-radius:18px;background:#ffffffd9;padding:28px;display:grid;place-items:center;position:relative}.specimen-note{position:absolute;left:10px;top:10px;color:var(--faint);font:10px var(--mono)}.specimen-tree{width:min(440px,100%);display:flex;flex-direction:column;gap:10px;align-items:stretch}.sp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp-column{display:flex;flex-direction:column;gap:8px}.sp-card{padding:14px;border:1px solid #dce1e8;border-radius:14px;background:#fff}.sp-region,.sp-frame{padding:14px;border:1px dashed #b8c2d0;border-radius:14px;background:#fbfcfe}.sp-button{min-height:38px;padding:0 16px;border:1px solid #c7cfda;border-radius:10px;background:#fff;font-weight:650}.sp-button.primary{background:var(--ink);border-color:var(--ink);color:#fff}.sp-button.danger{background:#fff0ee;border-color:#efbdb7;color:#7a2318}.sp-button.secondary{background:#f0edff;border-color:#d7cffb;color:#443577}.sp-toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 13px;border:1px solid #d8dee7;border-radius:12px;background:#fff}.sp-switch{width:38px;height:22px;border-radius:999px;background:#cfd5df;position:relative;flex:none}.sp-switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .12s}.sp-toggle.on .sp-switch{background:var(--ink)}.sp-toggle.on .sp-switch::after{left:19px}.sp-field{height:40px;border:1px solid #cfd5df;border-radius:10px;padding:0 11px;background:#fff}.sp-text{margin:0;color:var(--muted)}.sp-title{font-weight:700;color:var(--ink)}.sp-image{height:110px;border-radius:12px;background:linear-gradient(135deg,#e8ecf4,#d7ddea);display:grid;place-items:center;color:var(--muted);font-weight:650}.sp-dialog,.sp-sheet{padding:16px;border:1px solid #d8dee7;border-radius:16px;background:#fff;box-shadow:0 18px 38px -22px #18213a88}.sp-sheet{border-bottom-left-radius:6px;border-bottom-right-radius:6px}.sp-seam{height:3px;background:#b9c2d0;border-radius:999px}.sp-handle{width:22px;height:44px;border:1px solid #c7cfda;border-radius:10px;background:#fff;display:grid;place-items:center}.sp-unknown{padding:12px;border:1px dashed #c7cfda;border-radius:10px;color:var(--muted);font:11px var(--mono)}
.preview-toast{min-height:34px;padding:8px 16px;border-top:1px solid var(--rule);color:var(--muted);font-size:12px}.edge-strip{display:flex;gap:7px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--rule);background:#fafbfc}.edge{padding:4px 8px;border-radius:7px;background:#eef1f5;color:var(--muted);font-size:11px}.edge.absent{background:#fff7f1;color:#8a4d12}
.inspector{position:sticky;top:66px;max-height:calc(100vh - 88px);display:flex;flex-direction:column}.inspector .panel-body{overflow:auto}.inspector h3{font-size:12px;margin:14px 0 5px}.inspector h3:first-child{margin-top:0}.inspector p{margin:4px 0;color:var(--muted)}.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:5px 8px;font-size:12px}.kv .k{color:var(--faint)}.kv .v{min-width:0;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 7px;border:1px solid var(--rule);border-radius:999px;background:#fafbfc;font-size:10.5px;color:var(--muted)}.chip.good{color:var(--good);border-color:#b8dfce}.chip.held{color:var(--held);border-color:#e7bfd2}.inspector-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.evidence{margin-top:14px}.evidence-tabs{margin-bottom:10px}.evidence-body{max-height:300px;overflow:auto;border:1px solid var(--rule);border-radius:10px}.evidence-row{padding:9px 10px;border-bottom:1px solid #edf0f4;font-size:11.5px}.evidence-row:last-child{border-bottom:0}.evidence-row strong{display:block}.evidence-row .sub{display:block;margin-top:2px;color:var(--faint);font:10.5px var(--mono);overflow-wrap:anywhere}
.studio-shell{display:grid;grid-template-columns:280px minmax(0,1fr) 350px;gap:14px;margin-top:14px;align-items:start}.studio-canvas{min-height:660px}.studio-toolbar{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}.studio-toolbar input[type="text"]{height:34px;min-width:260px;border:1px solid var(--rule);border-radius:8px;padding:0 9px}.canvas{padding:22px;min-height:560px;background:linear-gradient(#f8f9fc 1px,transparent 1px),linear-gradient(90deg,#f8f9fc 1px,transparent 1px),#fff;background-size:24px 24px}.canvas-empty{height:460px;display:grid;place-items:center;text-align:center;color:var(--muted)}.canvas-empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.studio-tree{display:flex;flex-direction:column;gap:12px}.studio-node{border:1px solid var(--rule);border-radius:14px;background:#fff;padding:10px}.studio-node.on{border-color:var(--focus);box-shadow:0 0 0 2px #315bea14}.studio-node-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.studio-node-head .spacer{flex:1}.studio-node-head button{border:0;background:#f1f3f6;border-radius:7px;padding:4px 7px;font-size:11px}.studio-children{margin:10px 0 0 18px;padding-left:12px;border-left:2px solid #e5e9ef;display:flex;flex-direction:column;gap:10px}.studio-node .specimen-tree{max-width:360px}.blueprint{font:10.5px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:#111827;color:#dbe4f3;border-radius:10px;padding:10px;max-height:220px;overflow:auto}

<body>
<header class="bar"><a class="brand" href="./projects.html">VexBoard</a><a class="nav" href="./projects.html">Projects</a><span class="here">Components</span><span class="spacer"></span><a class="nav" href="./builder.html">Builder</a><a class="nav" href="./localization.html">Localization</a><a class="nav" href="../">VexWork</a></header>
<main class="page" id="app"><div class="hero"><div><h1>Component Library</h1><p>Loading current component source…</p></div></div></main>
<input id="studio-import" class="hidden" type="file" accept="application/json,.json">
<script type="module">
import * as Catalog from '../src/shared/vexboard-lens-catalog.mjs';
import * as Components from '../src/shared/vexboard-component-inventory.mjs';
import * as Architecture from '../src/shared/vexboard-component-architecture.mjs';
import * as Studio from '../src/shared/vexboard-component-studio.mjs';

const app=document.getElementById('app');
const importInput=document.getElementById('studio-import');
const CATALOG_URL='../projects/vexboard/lens/catalog.json';
const INVENTORY_DIR='../projects/component-library-architecture/inventory/';
const ARCHITECTURE_URL='../projects/component-library-architecture/component-architecture-catalog.json';
const params=new URLSearchParams(location.search);
const CONTAINER_KINDS=new Set(['COLUMN','ROW','STACK','CARD','MENU','SHEET','DIALOG','REGION','FRAME']);
const state={
 catalog:null,
 architecture:null,
 inventories:new Map(),
 mode:params.get('studio')==='1'?'STUDIO':'GALLERY',
 query:'',
 product:'',
 selectedKey:null,
 occurrenceIndex:0,
 evidence:'ABOUT',
 previewMessage:'Preview interactions are local only; no Product effect runs here.',
 studio:{label:'Untitled composition',nodes:[],selectedNodeRef:null,nextIndex:1},
};

function h(tag,attrs,...children){
 const node=document.createElement(tag);
 for(const [key,value] of Object.entries(attrs||{})){
  if(value===null||value===undefined||value===false)continue;
  if(key==='class')node.className=value;
  else if(key==='style')node.style.cssText=value;
  else if(key.startsWith('on'))node.addEventListener(key.slice(2),value);
  else if(key==='value')node.value=value;
  else node.setAttribute(key,value===true?'':String(value));
 }
 for(const child of children.flat(Infinity)){
  if(child===null||child===undefined||child===false)continue;
  node.append(child instanceof Node?child:document.createTextNode(String(child)));
 }
 return node;
}
async function fetchJson(url){
 const response=await fetch(url,{cache:'no-store'});
 if(!response.ok)throw new Error(url+' HTTP '+response.status);
 return response.json();
}
const human=(value)=>String(value??'').toLowerCase().split(/[_-]/u).map((word)=>word?word[0].toUpperCase()+word.slice(1):word).join(' ');
const short=(sha)=>String(sha??'').slice(0,7);
const count=(value)=>Number(value??0).toLocaleString();
const slug=(value)=>String(value??'studio').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'studio';

function inventoryEntries(){
 return [...state.inventories.entries()].map(([key,inventory])=>({slug:key,inventory,subject:Catalog.subjectFor(state.catalog,key)})).filter((row)=>row.subject).sort((a,b)=>a.subject.label.localeCompare(b.subject.label));
}
function familyRows(){
 const rows=[];
 for(const entry of inventoryEntries()){
  for(const component of entry.inventory.components){
   const occurrences=Components.occurrencesForComponent(entry.inventory,component.componentRef);
   rows.push({entry,component,occurrences,key:entry.slug+'|'+component.componentRef});
  }
 }
 return rows;
}
function visibleFamilies(){
 const needle=state.query.trim().toLowerCase();
 return familyRows().filter((row)=>{
  if(state.product&&row.entry.slug!==state.product)return false;
  if(!needle)return true;
  return [row.entry.subject.label,row.component.kind,row.component.componentRef,...row.component.styles,...row.component.textRoles,...row.occurrences.flatMap((o)=>[o.label,o.surfaceLabel,o.style,o.intent,o.sourcePath])].filter(Boolean).join('\n').toLowerCase().includes(needle);
 });
}
function selectedFamily(){
 const rows=familyRows();
 if(!state.selectedKey||!rows.some((row)=>row.key===state.selectedKey))state.selectedKey=rows[0]?.key??null;
 return rows.find((row)=>row.key===state.selectedKey)??null;
}
function selectedOccurrence(){
 const family=selectedFamily();
 if(!family)return null;
 if(state.occurrenceIndex>=family.occurrences.length)state.occurrenceIndex=0;
 return family.occurrences[state.occurrenceIndex]??null;
}
function occurrenceLabel(row,index){
 return (index+1)+'. '+row.label+' · '+row.surfaceLabel+(row.style?' · '+row.style:'');
}
function componentCandidates(family){
 return Architecture.candidatesForSourceFamily(state.architecture,family.component.componentRef);
}
function acceptedCandidates(family){
 return componentCandidates(family).filter((row)=>row.state==='ACCEPTED_PORTABLE'&&row.formation?.state==='ACCEPTED');
}
function heldCandidates(family){
 return componentCandidates(family).filter((row)=>row.state==='HELD'||row.formation?.state==='HELD');
}
function realizationRows(family){
 const refs=new Set(acceptedCandidates(family).map((row)=>row.candidateRef));
 return Architecture.targetRealizations(state.architecture).filter((row)=>refs.has(row.candidateRef));
}
function proofRows(family){
 return realizationRows(family).flatMap((row)=>row.proofs.map((proof)=>({realization:row,proof})));
}
function lensHref(family,row){
 if(!row?.screenRef)return null;
 return Catalog.lensHref(family.entry.subject,{build:'main',screen:row.screenRef,element:row.elementRef});
}
function styleClass(row){
 const value=String(row.style??'').toLowerCase();
 if(value.includes('danger'))return 'danger';
 if(value.includes('primary'))return 'primary';
 if(value.includes('secondary'))return 'secondary';
 return '';
}
function occurrenceMap(inventory){
 return new Map(inventory.occurrences.map((row)=>[row.elementRef,row]));
}
function specimenElement(row,inventory,depth){
 if(!row)return h('div',{class:'sp-unknown'},'No source specimen');
 const map=occurrenceMap(inventory);
 const children=row.childElementRefs.map((ref)=>map.get(ref)).filter(Boolean);
 const kids=()=>children.slice(0,8).map((child)=>specimenElement(child,inventory,(depth??0)+1));
 let node;
 switch(row.kind){
  case 'BUTTON':case 'FAB':case 'MENU_ITEM':{
   node=h('button',{type:'button',class:'sp-button '+styleClass(row),onclick:()=>{state.previewMessage='Activated locally: '+row.label+' · no Product effect was run.';renderPreviewToast();}},row.label);
   break;
  }
  case 'TOGGLE':{
   node=h('button',{type:'button',class:'sp-toggle','aria-pressed':'false',onclick:(event)=>{const button=event.currentTarget;const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',on?'true':'false');button.classList.toggle('on',on);state.previewMessage='Toggled local specimen '+(on?'on':'off')+' · Product State was not changed.';renderPreviewToast();}},h('span',{},row.label),h('span',{class:'sp-switch','aria-hidden':'true'}));
   break;
  }
  case 'FIELD':node=h('input',{class:'sp-field',placeholder:row.label,'aria-label':row.label});break;
  case 'TEXT':node=h('p',{class:'sp-text '+(String(row.textRole??'').toUpperCase().includes('TITLE')?'sp-title':'')},row.label);break;
  case 'IMAGE':node=h('div',{class:'sp-image'},row.label);break;
  case 'CARD':node=h('div',{class:'sp-card'},kids().length?kids():h('span',{class:'sp-text'},row.label));break;
  case 'ROW':case 'STACK':node=h('div',{class:'sp-row'},kids().length?kids():h('span',{class:'sp-text'},row.label));break;
  case 'COLUMN':case 'MENU':node=h('div',{class:'sp-column'},kids().length?kids():h('span',{class:'sp-text'},row.label));break;
  case 'REGION':case 'FRAME':node=h('div',{class:row.kind==='FRAME'?'sp-frame':'sp-region'},kids().length?kids():h('span',{class:'sp-text'},row.label));break;
  case 'DIALOG':node=h('div',{class:'sp-dialog'},h('strong',{},row.label),kids());break;
  case 'SHEET':node=h('div',{class:'sp-sheet'},h('strong',{},row.label),kids());break;
  case 'SEAM':node=h('div',{class:'sp-seam',title:row.label});break;
  case 'HANDLE':node=h('div',{class:'sp-handle',title:row.label},'↕');break;
  default:node=h('div',{class:'sp-unknown'},row.kind+' · '+row.label);
 }
 node.dataset.kind=row.kind;
 node.title=[row.elementRef,row.style,row.intent].filter(Boolean).join('\n');
 return node;
}
function blueprintSpecimen(node){
 const fake={
  kind:node.source.kind,label:node.source.label,style:node.presentation.styleOrNull,textRole:node.presentation.textRoleOrNull,
  childElementRefs:[],interactions:node.presentation.interactions,
 };
 return specimenElement(fake,{occurrences:[]},0);
}
function renderPreviewToast(){
 const target=document.getElementById('preview-toast');
 if(target)target.textContent=state.previewMessage;
}
function familyCard(row){
 const button=h('button',{type:'button',class:'family'+(state.selectedKey===row.key?' on':''),onclick:()=>{state.selectedKey=row.key;state.occurrenceIndex=0;state.evidence='ABOUT';render();}},
  h('div',{class:'top'},h('strong',{},human(row.component.kind)),h('span',{class:'product'},row.entry.subject.label)),
  h('div',{class:'meta'},h('span',{},count(row.occurrences.length)+' examples'),h('span',{},count(row.component.styles.length)+' styles'),acceptedCandidates(row).length?h('span',{class:'badge good'},'portable relationship'):null),
  h('div',{class:'ref'},row.component.componentRef)
 );
 return button;
}
function libraryPanel(){
 const rows=visibleFamilies();
 const search=h('input',{class:'search',type:'search',placeholder:'Find a component, style, intent, or screen',value:state.query,'aria-label':'Search component library',oninput:(event)=>{state.query=event.target.value;render();}});
 const product=h('select',{'aria-label':'Filter Product',onchange:(event)=>{state.product=event.target.value;state.selectedKey=null;state.occurrenceIndex=0;render();}},
  h('option',{value:'',selected:!state.product},'All Products'),
  inventoryEntries().map((entry)=>h('option',{value:entry.slug,selected:state.product===entry.slug},entry.subject.label))
 );
 return h('aside',{class:'panel library'},h('div',{class:'panel-head'},h('h2',{},'Library'),h('span',{class:'spacer'}),h('span',{class:'badge'},count(rows.length))),h('div',{class:'panel-body'},search,h('div',{class:'filters'},product,h('select',{'aria-label':'Library meaning'},h('option',{},'Source-grounded'))),h('div',{class:'family-list'},rows.map(familyCard))));
}
function edgeEvidence(row){
 const items=[];
 if(row.visibleWhen)items.push(['visible when',row.visibleWhen]);
 if(row.alwaysVisible)items.push(['always visible','source-authored']);
 for(const ref of row.realization.presenceRefs)items.push(['presence',ref]);
 for(const ref of row.realization.conditionRefs)items.push(['condition',ref]);
 for(const value of row.interactions)items.push(['interaction',value]);
 if(row.childElementRefs.length)items.push(['children',String(row.childElementRefs.length)]);
 if(row.localization.sourceStringRefs.length)items.push(['localized',String(row.localization.sourceStringRefs.length)+' bindings']);
 if(!items.length)items.push(['state','no explicit state/condition projected']);
 items.push(['accessibility',human(row.accessibility.state)]);
 return items;
}
function evidenceSection(family,row){
 const tabs=['ABOUT','WHERE_USED','REALIZATIONS','PROOF','SOURCE'];
 const tabBar=h('div',{class:'evidence-tabs'},tabs.map((key)=>h('button',{type:'button',class:'tab'+(state.evidence===key?' on':''),onclick:()=>{state.evidence=key;render();}},human(key))));
 let body=[];
