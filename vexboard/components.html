<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VexBoard Component Library</title>
<meta name="description" content="Every source-grounded building block Vex already knows how to build: see it by itself, step through real examples, inspect evidence, and use it in the Builder.">
<style>
:root{--paper:#f4f6f9;--sheet:#fff;--ink:#18213a;--muted:#5f6b80;--faint:#8a94a6;--rule:#dde2ea;--rule2:#c9d0db;--focus:#2f5be6;--soft:#eef2ff;--good:#14794a;--warn:#9a5b00;--held:#9a3a63;--violet:#6b3fd1;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--focus)}code,.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar{height:46px;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}.bar a{color:var(--muted);text-decoration:none}.bar .brand{color:var(--ink);font-weight:750}.bar .here{font-weight:700}.bar .spacer{flex:1}
.page{max-width:1520px;margin:0 auto;padding:20px 20px 70px}
.hero{display:flex;align-items:flex-start;gap:18px;justify-content:space-between}.hero h1{margin:0;font-size:26px;letter-spacing:-.02em}.hero p{margin:7px 0 0;color:var(--muted);max-width:84ch}
.truth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border:1px solid var(--rule);border-radius:999px;background:#fff;color:var(--muted);font-size:11.5px}.badge.good{color:var(--good);border-color:#b8dfce;background:#f4fbf7}.badge.held{color:var(--held);border-color:#e7bfd2;background:#fff7fa}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr) 360px;gap:14px;margin-top:16px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--rule)}.panel-head h2{font-size:13px;margin:0}
.panel-body{padding:12px}
.library{position:sticky;top:62px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}.library .panel-body{overflow:auto}
.search{width:100%;height:36px;border:1px solid var(--rule2);border-radius:8px;padding:0 10px;background:#fff}
.library select{width:100%;height:34px;margin-top:7px;border:1px solid var(--rule2);border-radius:8px;background:#fff;padding:0 7px}
.lib-section h3{display:flex;justify-content:space-between;margin:14px 2px 6px;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}.lib-section .count{color:var(--faint);font-weight:500}
.lib-card{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;width:100%;margin-top:6px;padding:7px;border:1px solid var(--rule);border-radius:10px;background:#fff;text-align:start}
.lib-card:hover{border-color:#b6c0cf}.lib-card.on{border-color:var(--focus);box-shadow:0 0 0 2px #2f5be61a}
.lib-thumb{display:grid;place-items:center;height:50px;padding:4px;border-radius:7px;background:#f6f8fb;overflow:hidden}
.lib-text{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:11.5px;color:var(--faint)}.lib-text strong{color:var(--ink);font-size:13px}
.stage{min-height:600px}
.stage-top{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--rule)}.stage-top h2{margin:0;font-size:19px}.stage-top p{margin:4px 0 0;color:var(--muted)}
.actions{margin-inline-start:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid var(--rule2);border-radius:8px;background:#fff;font-weight:650;font-size:12.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.soft{background:var(--soft);border-color:#c8d3fb;color:#2241b8}
.example-bar{display:flex;gap:7px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);background:#fafbfc}
.example-bar select{flex:1;min-width:0;height:34px;border:1px solid var(--rule2);border-radius:8px;background:#fff;padding:0 8px}
.counter{color:var(--faint);font-size:12px;white-space:nowrap}
.specimen-wrap{padding:24px;background:radial-gradient(circle at 1px 1px,#dfe4ec 1px,transparent 0) 0 0/18px 18px}
.specimen-stage{position:relative;max-width:560px;margin:0 auto;padding:34px 22px 22px;border:1px dashed #c9d1dd;border-radius:16px;background:#fff}
.specimen-note{position:absolute;top:9px;inset-inline-start:12px;color:var(--faint);font:10.5px var(--mono)}
.specimen-tree{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.specimen-press{border:0;background:none;padding:0;text-align:inherit;display:block;width:100%}
.specimen-press>.vx-button,.specimen-press>.vx-fab{width:auto}
.more-kids,.empty-kids{color:var(--faint);font-size:11px;font-style:italic}
.preview-toast{margin:0 16px;padding:9px 12px;border-radius:9px;background:#f1f6ff;color:#284a99;font-size:12.5px}
.edge-strip{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 16px}.edge{padding:3px 9px;border:1px solid var(--rule);border-radius:999px;font-size:11.5px;color:var(--muted)}.edge.absent{border-style:dashed;color:var(--faint)}
.inspector h3{font-size:12.5px;margin:16px 0 6px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;margin:0;font-size:12px}.kv dt{color:var(--faint)}.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:2px 9px;border-radius:999px;background:#f1f3f7;color:var(--muted);font-size:11.5px}.chip.good{background:#e8f6ee;color:var(--good)}.chip.held{background:#fff0f6;color:var(--held)}
.muted{color:var(--faint);font-size:12.5px;margin:0}
.inspector-actions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.evidence{margin-top:8px;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.evidence-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:4px;background:#f6f7fa;border-bottom:1px solid var(--rule)}
.tab{border:0;border-radius:7px;background:transparent;padding:6px 9px;font-weight:650;font-size:12px;color:var(--muted)}.tab.on{background:var(--ink);color:#fff}
.evidence-body{max-height:360px;overflow:auto}
.evidence-row{display:flex;flex-direction:column;gap:3px;padding:9px 12px;border-bottom:1px solid #eef1f5;font-size:12.5px}
.link-row{width:100%;border:0;border-bottom:1px solid #eef1f5;background:none;text-align:start}.link-row:hover{background:#f6f8fb}
.sub{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.seam-kind{padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700}.seam-action{background:#eef6ff;color:#1f5aa8}.seam-navigation{background:#e8f6ee;color:var(--good)}.seam-presentation{background:#f1ebfd;color:var(--violet)}
@media(max-width:1180px){.shell{grid-template-columns:260px minmax(0,1fr)}.inspector{grid-column:1/-1}}
@media(max-width:780px){.shell{grid-template-columns:1fr}.library{position:static;max-height:none}.hero{display:block}.truth{margin-top:10px}}
</style>
</head>
<body>
<header class="bar"><a class="brand" href="./projects.html">VexBoard</a><a href="./projects.html">Projects</a><span class="here" aria-current="page">Components</span><a href="./builder.html">Builder</a><span class="spacer"></span><a href="./localization.html">Localization</a><a href="../">VexWork</a></header>

boot();
</script>
</body>
</html>
